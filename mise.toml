min_version = "2025.1.0"

[tools]
node = "22"
"npm:markdownlint-cli2" = "0.17"
"npm:dprint" = "latest"

[tasks.fmt]
description = "Format all markdown and JSON files"
run = "dprint fmt"

[tasks."fmt:check"]
description = "Check formatting (no write)"
run = "dprint check"

[tasks."lint:md"]
description = "Lint markdown files (globs from .markdownlint-cli2.yaml)"
run = "markdownlint-cli2"

[tasks."lint:md:fix"]
description = "Lint markdown with auto-fix"
run = "markdownlint-cli2 --fix"

[tasks.lint]
description = "Run all linters"
depends = ["lint:md"]

[tasks.bump]
description = "Bump a plugin version (usage: mise run bump -- <plugin> <major|minor|patch>)"
run = "node tools/bump-version.cjs {{arg(name='plugin', i=0)}} {{arg(name='level', i=1)}}"

[tasks."validate:frontmatter"]
description = "Validate SKILL.md frontmatter across all plugins"
run = "uv run tools/validate_frontmatter.py"

[tasks."validate:size"]
description = "Check SKILL.md line counts across all plugins"
run = "uv run tools/validate_size.py"

[tasks."validate:refs"]
description = "Detect orphaned references and broken links across all plugins"
run = "uv run tools/validate_references.py"

[tasks."validate:freshness"]
description = "Check library version freshness in skills"
run = "uv run tools/check_freshness.py"

[tasks."validate:versions"]
description = "Verify each owned plugin's version matches its marketplace entry"
run = "uv run tools/validate_versions.py"

[tasks.validate]
description = "Run all validation checks"
depends = ["validate:frontmatter", "validate:size", "validate:refs", "validate:freshness", "validate:versions"]

[tasks."init:skill"]
description = "Scaffold a new skill (usage: mise run init:skill -- <plugin> <name> 'description')"
run = "uv run tools/init_skill.py {{arg(name='plugin', i=0)}} {{arg(name='name', i=1)}} {{arg(name='description', i=2)}}"

[tasks.build]
description = "Full build: lint + format check + validate"
depends = ["lint", "fmt:check", "validate"]
