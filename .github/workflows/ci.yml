name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: lint + format + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install mise and tools
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Build (lint + fmt:check + validate)
        run: mise run build
