# Markdown lint configuration for agentic-plugins
config:
  # Use ATX-style headings (#)
  heading-style:
    style: atx

  # Disable line length — dprint handles wrapping
  line-length: false

  # Disable table-column-style — dprint owns table alignment, and it aligns by
  # display width while MD060 counts character offsets; the two can't agree on
  # tables containing double-width glyphs (★, ✅, ⚠️). dprint is authoritative.
  table-column-style: false

  # Allow multiple top-level headings (SKILL.md has frontmatter + # heading)
  single-h1: false

  # Consistent unordered list markers
  ul-style:
    style: dash

  # No trailing spaces
  no-trailing-spaces: true

  # Allow inline HTML (some skills use <details>, <example> tags)
  no-inline-html: false

  # Allow bold text as section labels (numbered sections, definition labels)
  no-emphasis-as-heading: false

  # Allow duplicate headings (reference docs repeat "When to Use", "Code Example", etc.)
  no-duplicate-heading: false

  # Allow files to start without h1 (reference sub-documents under skills/)
  first-line-heading: false

  # Allow heading level increments > 1 (templates may start at h3)
  heading-increment: false

  # YAML frontmatter awareness
  front-matter: null

globs:
  - "plugins/**/*.md"

ignores:
  - "plugins/**/-workspace/**"
  - "plugins/**/evals/fixtures/**"
  - "**/node_modules/**"
