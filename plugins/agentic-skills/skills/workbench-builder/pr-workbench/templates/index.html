<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PR review room</title>
  <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'&gt;&lt;rect width='16' height='16' rx='4' fill='%23fcfdfe'/&gt;&lt;path d='M5 4v8M11 4v8' stroke='%23274d7a' stroke-width='2'/&gt;&lt;circle cx='5' cy='4' r='2' fill='%23274d7a'/&gt;&lt;circle cx='11' cy='12' r='2' fill='%23274d7a'/&gt;&lt;/svg&gt;">

  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
          integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.4"
          integrity="sha384-A986SAtodyH8eg8x8irJnYUk7i9inVQqYigD6qZ9evobksGNIXfeFvDwLSHcp31N"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@18.0.4/lib/marked.umd.min.js"
          integrity="sha384-QIom/Ao3tGhg4C4VY5VTDrHMTPzgsih5cGuY30rd/xp6hWQ+xIGIZ4kxhaQQY+PB"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.7/dist/purify.min.js"
          integrity="sha384-C5g1ZoYBpnvKyArNZI21kaBEk3egHOYfHj/cUOHmyJ7CSDMyNMyM+STqfkBt8m2Y"
          crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css"
        integrity="sha384-eFTL69TLRZTkNfYZOLM+G04821K1qZao/4QLJbet1pP4tcF+fdXq/9CdqAbWRl/L"
        crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/highlight.min.js"
          integrity="sha384-RH2xi4eIQ/gjtbs9fUXM68sLSi99C7ZWBRX1vDrVv6GQXRibxXLbwO2NGZB74MbU"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked-highlight@2.2.4/lib/index.umd.js"
          integrity="sha384-BjBE0bY2PIGsLgdqaC1+iwO397c7jxwJdNszWabXYxrbMXBTS9QCPxXJElH8xOE/"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.15.0/dist/mermaid.min.js"
          integrity="sha384-yQ4mmBBT+vhTAwjFH0toJXNYJ6O4usWnt6EPIdWwrRvx2V/n5lXuDZQwQFeSFydF"
          crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:        #e8edf1;
      --panel:     #fcfdfe;
      --panel-2:   #dadfe5;
      --line:      #c7cfd7;
      --line-hi:   #a9b4bf;
      --ink:       #0b0f14;
      --muted:     #3b4753;
      --faint:     #586471;
      --violet:    #274d7a;   /* primary accent — Graphite navy (kept --violet name) */
      --high:      #9a3b33;   /* high risk / blocker — redline red */
      --med:       #7a5512;   /* medium / warn — amber */
      --low:       #0a6961;   /* low / safe — teal */
      --add:       #1f7a43;   /* diff add — muted green, keeps additions legible vs --low teal */
      --del:       #9a3b33;   /* diff del — redline red */
      --strip-h:   78px;      /* rendered height of sticky .strip — couples .rail top to one source */
    }
    * { box-sizing: border-box; }
    :focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font: 14px/1.5 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; color: var(--ink);
      background: radial-gradient(1100px 600px at 80% -15%, rgba(39,77,122,0.06) 0%, transparent 55%),
                  radial-gradient(900px 520px at 12% 8%, rgba(10,105,97,0.07) 0%, transparent 55%),
                  var(--bg);
      padding: 0 0 60px;
    }
    ::selection { background: var(--violet); color: #fcfdfe; }
    ::-webkit-scrollbar { width: 11px; height: 11px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--line-hi); border-radius: 7px; border: 2px solid var(--bg); }
    ::-webkit-scrollbar-thumb:hover { background: var(--faint); }

    /* ---- top command strip ---------------------------------------------- */
    .strip { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 22px;
             row-gap: 12px; padding: 14px 24px; background: rgba(218,223,229,0.90); backdrop-filter: blur(10px);
             border-bottom: 1px solid var(--line); }
    .brand { font-family: "Tiempos Headline", "Iowan Old Style", "Charter", Georgia, "Times New Roman", serif; font-weight: 600; font-size: 18px; letter-spacing: -0.01em; }
    .brand .b { color: var(--violet); }
    .repo { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--faint);
            padding: 3px 9px; border: 1px solid var(--line); border-radius: 7px; }
    #overview { display: flex; gap: 20px; align-items: center; }
    .ov-stat { display: flex; flex-direction: column; line-height: 1.1; }
    .ov-stat .n { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 17px; }
    .ov-stat .k { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--faint); margin-top: 3px; }
    .ov-stat.adds .n { color: var(--add); } .ov-stat.dels .n { color: var(--del); }
    .ov-stat.block .n { color: var(--high); } .ov-stat.col .n { color: var(--violet); }
    .live { margin-left: auto; font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--muted);
            display: flex; align-items: center; gap: 7px; }
    .live .led { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
    .live.on .led { background: var(--low); box-shadow: 0 0 9px 1px var(--low); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

    /* ---- main split: fleet | collision rail ----------------------------- */
    .wrap { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 20px; padding: 22px 24px; align-items: start; }
    @media (max-width: 1000px) { .wrap { grid-template-columns: 1fr; } }
    .zone-label { font-family: "JetBrains Mono", monospace; font-size: 10px; text-transform: uppercase;
                  letter-spacing: 0.16em; color: var(--faint); margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
    .zone-label::before { content: ""; width: 14px; height: 1px; background: var(--violet); }

    /* ---- fleet cards ----------------------------------------------------- */
    .fleet { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
    .pr { background: linear-gradient(180deg, var(--panel), #f4f7fa); border: 1px solid var(--line);
          border-radius: 13px; padding: 14px 15px; cursor: pointer; position: relative; overflow: hidden;
          transition: transform .14s, border-color .14s, box-shadow .14s; }
    .pr::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
    .pr.risk-high::before { background: var(--high); }
    .pr.risk-medium::before { background: var(--med); }
    .pr.risk-low::before { background: var(--low); }
    .pr:hover { transform: translateY(-2px); border-color: var(--line-hi);
                box-shadow: 0 16px 40px -22px rgba(11,15,20,0.10), 0 0 0 1px var(--violet) inset; }
    .pr-top { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .pr-num { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--violet); font-weight: 700; }
    .pr-state { font-family: "JetBrains Mono", monospace; font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.08em;
                padding: 2px 7px; border-radius: 5px; border: 1px solid var(--line-hi); color: var(--muted); }
    .pr-state.approved { color: var(--low); border-color: rgba(10,105,97,0.40); }
    .pr-state.changes { color: var(--high); border-color: rgba(154,59,51,0.40); }
    .pr-state.draft { color: var(--faint); }
    .pr-risk { margin-left: auto; font-family: "JetBrains Mono", monospace; font-size: 8.5px;
               text-transform: uppercase; letter-spacing: 0.06em; }
    .pr-risk.high { color: var(--high); } .pr-risk.medium { color: var(--med); } .pr-risk.low { color: var(--low); }
    .pr-title { font-family: "Tiempos Headline", "Iowan Old Style", "Charter", Georgia, "Times New Roman", serif; font-weight: 500; font-size: 14.5px;
                line-height: 1.3; margin: 0 0 9px; }
    .pr-meta { display: flex; align-items: center; gap: 10px; font-family: "JetBrains Mono", monospace;
               font-size: 10px; color: var(--muted); margin-bottom: 10px; }
    .pr-meta .author::before { content: "@"; color: var(--faint); }
    /* churn bar: green add / red del proportions */
    .churn { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex; margin-bottom: 9px; }
    .churn .a { background: var(--add); } .churn .d { background: var(--del); }
    .pr-foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .badge { font-family: "JetBrains Mono", monospace; font-size: 9.5px; padding: 2px 7px; border-radius: 999px;
             display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line-hi); color: var(--muted); }
    .badge.files { color: var(--muted); }
    .badge.block { color: var(--high); border-color: rgba(154,59,51,0.30); background: rgba(154,59,51,0.10); }
    .badge.warn { color: var(--med); border-color: rgba(122,85,18,0.30); background: rgba(122,85,18,0.10); }
    .badge.nit { color: var(--muted); }
    .badge.col { color: var(--violet); border-color: rgba(39,77,122,0.30); background: rgba(39,77,122,0.12); }

    /* ---- collision rail -------------------------------------------------- */
    .rail { background: linear-gradient(180deg, var(--panel), #f4f7fa); border: 1px solid var(--line);
            border-radius: 13px; padding: 15px; position: sticky; top: var(--strip-h); }
    .col-item { padding: 10px 0; border-bottom: 1px solid var(--line); }
    .col-item:last-child { border-bottom: none; }
    .col-path { font-family: "JetBrains Mono", monospace; font-size: 11.5px; color: var(--ink);
                overflow-wrap: anywhere; display: flex; align-items: baseline; gap: 7px; }
    .col-path .heat { font-size: 9px; padding: 1px 6px; border-radius: 999px; flex: 0 0 auto;
                      background: rgba(39,77,122,0.12); color: var(--violet); font-weight: 700; }
    .col-prs { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
    .col-chip { font-family: "JetBrains Mono", monospace; font-size: 9.5px; padding: 1px 7px; border-radius: 6px;
                border: 1px solid var(--line-hi); color: var(--muted); cursor: pointer; transition: all .12s; }
    .col-chip:hover { border-color: var(--violet); color: var(--violet); }
    .col-chip.risk-high { border-color: rgba(154,59,51,0.40); color: var(--high); }
    .order { font-family: "JetBrains Mono", monospace; font-size: 10px; color: var(--muted); margin-top: 8px;
             padding: 8px 10px; background: var(--panel-2); border-radius: 8px; line-height: 1.6; }
    .order b { color: var(--violet); }
    .empty { color: var(--faint); font-size: 12px; font-family: "JetBrains Mono", monospace; }

    /* ---- detail sheet ---------------------------------------------------- */
    .ov { position: fixed; inset: 0; display: none; z-index: 60; }
    .ov.open { display: block; }
    .scrim { position: absolute; inset: 0; background: rgba(11,15,20,0.45); backdrop-filter: blur(5px); }
    .sheet { position: absolute; top: 0; right: 0; height: 100%; width: min(620px, 96vw);
             background: var(--panel); border-left: 1px solid var(--line-hi);
             box-shadow: -40px 0 100px -30px rgba(11,15,20,0.20); overflow: auto;
             transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1); }
    .ov.open .sheet { transform: translateX(0); }
    .sheet-head { position: sticky; top: 0; z-index: 1; padding: 16px 20px; background: var(--panel-2);
                  border-bottom: 1px solid var(--line); }
    .sheet-head .row1 { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
    .sheet-head .x { margin-left: auto; cursor: pointer; background: none; border: 1px solid var(--line-hi);
                     color: var(--muted); border-radius: 7px; font-family: "JetBrains Mono", monospace;
                     font-size: 10px; padding: 4px 10px; }
    .sheet-head .x:hover { color: var(--violet); border-color: var(--violet); }
    .sheet-head h2 { font-family: "Tiempos Headline", "Iowan Old Style", "Charter", Georgia, "Times New Roman", serif; font-weight: 500; font-size: 17px; margin: 0; line-height: 1.3; }
    .sheet-body { padding: 18px 20px; }
    .sec { margin-bottom: 22px; }
    .sec > h3 { font-family: "JetBrains Mono", monospace; font-size: 10px; text-transform: uppercase;
                letter-spacing: 0.14em; color: var(--faint); margin: 0 0 10px; }

    /* file tree in sheet */
    .file { display: grid; grid-template-columns: 14px minmax(0,1fr) auto; gap: 9px; align-items: center;
            padding: 5px 0; font-family: "JetBrains Mono", monospace; font-size: 11.5px; }
    .file .k { font-weight: 700; text-align: center; }
    .file .k.added { color: var(--add); } .file .k.deleted { color: var(--del); }
    .file .k.modified { color: var(--med); } .file .k.renamed { color: var(--violet); }
    .file .p { overflow-wrap: anywhere; }
    .file .p .collide { color: var(--violet); font-size: 9px; margin-left: 6px; }
    .file .bar { width: 90px; height: 5px; border-radius: 3px; background: var(--line); display: flex; overflow: hidden; }
    .file .bar .a { background: var(--add); } .file .bar .d { background: var(--del); }

    /* concerns */
    .concern { border-left: 2px solid; padding: 8px 11px; border-radius: 7px; margin-bottom: 9px; background: var(--panel-2); }
    .concern.blocker { border-color: var(--high); } .concern.warn { border-color: var(--med); }
    .concern.nit { border-color: var(--faint); }
    .concern .ctop { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
    .concern .sev { font-family: "JetBrains Mono", monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
    .concern.blocker .sev { color: var(--high); } .concern.warn .sev { color: var(--med); } .concern.nit .sev { color: var(--muted); }
    .concern .cpath { font-family: "JetBrains Mono", monospace; font-size: 10px; color: var(--faint); margin-left: auto; }
    .concern .ctitle { font-weight: 600; font-size: 13px; }
    .concern.resolved { opacity: .5; } .concern.resolved .ctitle { text-decoration: line-through; }
    .concern .resolve { cursor: pointer; background: none; border: 1px solid var(--line-hi); color: var(--muted);
                        border-radius: 6px; font: 10px "JetBrains Mono", monospace; padding: 2px 8px; margin-top: 6px; }
    .concern .resolve:hover { color: var(--low); border-color: var(--low); }

    /* markdown (summary + concern bodies) */
    .md { font-size: 13px; min-width: 0; overflow-wrap: anywhere; }
    .md p { margin: 4px 0; } .md a { color: var(--violet); }
    .md code { font-family: "JetBrains Mono", monospace; font-size: 11.5px; background: rgba(11,15,20,0.05); padding: 1px 5px; border-radius: 4px; }
    .md pre { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 8px 0; overflow-x: auto; }
    .md pre code { background: none; padding: 0; }
    .md pre.mermaid { text-align: center; }
    .md pre.mermaid svg { max-width: 100%; height: auto; }

    .overlap-chip { display: inline-flex; gap: 5px; align-items: center; font-family: "JetBrains Mono", monospace;
                    font-size: 10px; color: var(--violet); border: 1px solid rgba(39,77,122,0.30); background: rgba(39,77,122,0.12);
                    border-radius: 6px; padding: 2px 8px; cursor: pointer; margin: 0 5px 5px 0; }
    .overlap-chip:hover { background: rgba(39,77,122,0.18); }

    /* ---- fleet "ask claude" badges -------------------------------------- */
    .badge.working { color: var(--violet); border-color: rgba(39,77,122,0.35); background: rgba(39,77,122,0.12); }
    .badge.working::before { content: ""; width: 6px; height: 6px; border-radius: 50%;
                             background: var(--violet); animation: pulse 1.2s infinite; }
    .badge.queued { color: var(--med); border-color: rgba(122,85,18,0.30); background: rgba(122,85,18,0.10); }
    .badge.answered { color: var(--low); border-color: rgba(10,105,97,0.30); background: rgba(10,105,97,0.10); }

    /* ---- review queue rail ---------------------------------------------- */
    .queue .q-item { display: grid; grid-template-columns: 8px minmax(0,1fr) auto; gap: 9px; align-items: start;
                     padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
    .queue .q-item:last-child { border-bottom: none; }
    .queue .q-item:hover .q-body { color: var(--ink); }
    .q-status { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; background: var(--med); }
    .q-status.working { background: var(--violet); box-shadow: 0 0 8px 1px var(--violet); animation: pulse 1.2s infinite; }
    .q-line { display: flex; align-items: center; gap: 7px; margin-bottom: 2px; }
    .q-pr { font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 700; color: var(--violet); }
    .q-kind { font-family: "JetBrains Mono", monospace; font-size: 9px; text-transform: uppercase;
              letter-spacing: 0.06em; color: var(--faint); }
    .q-body { font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; line-height: 1.4;
              display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .q-tag { font-family: "JetBrains Mono", monospace; font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.06em;
             padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line-hi); color: var(--muted); white-space: nowrap; }
    .q-tag.working { color: var(--violet); border-color: rgba(39,77,122,0.35); }

    /* ---- review console (in detail sheet) ------------------------------- */
    .composer { margin-bottom: 14px; }
    .quick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .qbtn { font-family: "JetBrains Mono", monospace; font-size: 10px; cursor: pointer;
            background: var(--panel-2); border: 1px solid var(--line-hi); color: var(--muted);
            border-radius: 7px; padding: 4px 9px; transition: all .12s; }
    .qbtn:hover { color: var(--violet); border-color: var(--violet); transform: translateY(-1px); }
    .ask-in { width: 100%; font: 13px/1.45 "Inter", sans-serif; background: var(--bg); color: var(--ink);
              border: 1px solid var(--line-hi); border-radius: 9px; padding: 9px 11px; resize: vertical; }
    .ask-in:focus { outline: none; border-color: var(--violet); box-shadow: 0 0 0 3px rgba(39,77,122,0.18); }
    .ask-in::placeholder { color: var(--faint); }
    .ask-send { margin-top: 7px; font-family: "JetBrains Mono", monospace; font-size: 11px; cursor: pointer;
                background: var(--violet); color: #fcfdfe; font-weight: 700; border: none;
                border-radius: 8px; padding: 7px 14px; transition: filter .12s; }
    .ask-send:hover { filter: brightness(1.12); }

    .req { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: var(--panel-2); }
    .req.working { border-color: rgba(39,77,122,0.30); }
    .req-top { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    .who { font-family: "JetBrains Mono", monospace; font-size: 9px; font-weight: 700; text-transform: uppercase;
           letter-spacing: 0.08em; padding: 1px 7px; border-radius: 5px; }
    .who.you { color: var(--low); background: rgba(10,105,97,0.12); }
    .who.claude { color: var(--violet); background: rgba(39,77,122,0.12); }
    .req-kind { font-family: "JetBrains Mono", monospace; font-size: 9px; text-transform: uppercase;
                letter-spacing: 0.06em; color: var(--faint); }
    .req-status { font-family: "JetBrains Mono", monospace; font-size: 9px; color: var(--muted); }
    .req-status.working { color: var(--violet); }
    .req-status.answered { color: var(--low); }
    .req-t { margin-left: auto; font-family: "JetBrains Mono", monospace; font-size: 9px; color: var(--faint); }
    .req-ask { color: var(--ink); }
    .req-resp { margin-top: 9px; padding-top: 9px; border-top: 1px dashed var(--line); }
    .req-resp.pending { color: var(--violet); font-family: "JetBrains Mono", monospace; font-size: 11px;
                        display: flex; align-items: center; gap: 8px; }
    .dots { display: inline-flex; gap: 3px; }
    .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--violet); animation: blink 1.2s infinite; }
    .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }
  </style>
</head>

<body hx-ext="sse" sse-connect="/events">
  <div class="strip">
    <span class="brand">PR review<span class="b"> room</span></span>
    <span class="repo">acme/payments-api</span>
    <div id="overview" hx-get="/partials/overview" hx-trigger="load, sse:overview"></div>
    <span class="live" id="live"><span class="led"></span><span id="live-txt">connecting…</span></span>
  </div>

  <div class="wrap">
    <div>
      <p class="zone-label">fleet · {{ '' }}open change-set</p>
      <div id="fleet" class="fleet" hx-get="/partials/fleet" hx-trigger="load, sse:fleet"></div>
    </div>
    <div>
      <p class="zone-label">file collisions · merge order</p>
      <div class="rail" id="collisions" hx-get="/partials/collisions" hx-trigger="load, sse:collisions"></div>
      <p class="zone-label" style="margin-top:20px">review queue · you → claude</p>
      <div class="rail queue" id="queue" hx-get="/partials/queue" hx-trigger="load, sse:queue"></div>
    </div>
  </div>

  <!-- PR detail sheet -->
  <div class="ov" id="sheet-ov">
    <div class="scrim" data-close></div>
    <div class="sheet" id="sheet"></div>
  </div>

  <script>
    // markdown engine (same proven pipeline as the eval workbench)
    mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'strict',
      themeVariables: { fontFamily: 'JetBrains Mono, monospace', fontSize: '12px',
        primaryColor: '#dadfe5', primaryBorderColor: '#274d7a', lineColor: '#586471', primaryTextColor: '#0b0f14' } });
    marked.use(markedHighlight.markedHighlight({ langPrefix: 'hljs language-',
      highlight(code, lang) { if (lang === 'mermaid') return code;
        const l = hljs.getLanguage(lang) ? lang : 'plaintext'; return hljs.highlight(code, { language: l }).value; } }));
    marked.use({ renderer: { code(t) {
      if (t.lang === 'mermaid') return `<pre class="mermaid">${t.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</pre>`;
      return false; } } });
    let mmid = 0;
    async function renderMd(root) {
      for (const el of (root || document).querySelectorAll('.md:not([data-md])')) {
        el.innerHTML = DOMPurify.sanitize(marked.parse(el.textContent.trim()), { ADD_TAGS: ['pre'], ADD_ATTR: ['class'] });
        el.dataset.md = '1';
        const d = el.querySelectorAll('pre.mermaid:not([data-mm])');
        d.forEach(x => { x.id = 'mm-' + (mmid++); x.dataset.mm = '1'; });
        if (d.length) await mermaid.run({ nodes: d }).catch(() => {});
      }
    }

    // open / close the detail sheet
    const ov = document.getElementById('sheet-ov'), sheet = document.getElementById('sheet');
    async function openPR(pid) {
      const html = await (await fetch('/partials/pr/' + pid)).text();
      sheet.innerHTML = html;
      ov.classList.add('open');
      await renderMd(sheet);
      htmx.process(sheet);   // wire any hx-* in the loaded fragment
    }
    function closeSheet() { ov.classList.remove('open'); }

    document.addEventListener('click', (e) => {
      const card = e.target.closest('[data-pr]');
      if (card) { openPR(card.dataset.pr); return; }
      if (e.target.closest('[data-close]')) closeSheet();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeSheet(); return; }
      // keyboard a11y: Enter/Space on a focused PR card opens it, same as click
      if (e.key === 'Enter' || e.key === ' ') {
        const card = e.target.closest('[data-pr]');
        if (card) { e.preventDefault(); openPR(card.dataset.pr); }
      }
    });

    // live indicator + re-render markdown after any swap
    const live = document.getElementById('live'), liveTxt = document.getElementById('live-txt');
    document.body.addEventListener('htmx:sseOpen',  () => { live.className = 'live on'; liveTxt.textContent = 'live'; });
    document.body.addEventListener('htmx:sseError', () => { live.className = 'live'; liveTxt.textContent = 'reconnecting…'; });
    document.body.addEventListener('htmx:afterSwap', e => renderMd(e.target));
  </script>
</body>
</html>
