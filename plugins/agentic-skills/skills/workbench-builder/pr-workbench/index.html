<!doctype html>
<!-- Fullstack entry: Bun.serve imports this file and transpiles src/main.tsx
     (and everything it imports, including CSS) on demand. No bundler config. -->
<!-- `astryx theme build` wraps every rule it emits in
     `@scope ([data-astryx-theme="graphite"]) to ([data-astryx-theme])`, so the
     Graphite tokens only resolve on elements carrying that attribute. The <Theme>
     provider in src/main.tsx writes both attributes onto <html> too, but it does
     so in a layout effect — declaring them here means the first painted frame is
     already Graphite instead of flashing core's light-dark() defaults.
     data-theme drives color-scheme, hence browser chrome (scrollbars, native
     controls); it must match the provider's `mode`. -->
<html lang="en" data-astryx-theme="graphite" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PR Review Room</title>
    <!-- Pins @layer precedence ahead of the bundler's stylesheet links. Bun
         emits the CSS imports from src/main.tsx in reverse order, and
         src/theme/graphite.css opens with its own `@layer reset` block, so
         first-appearance ordering resolves to `reset, astryx-theme, astryx-base`:
         astryx-base wins and core's :root token defaults beat Graphite's :scope
         tokens even with the attribute set. This statement fixes the order
         however the links land. Layer names verified against the built CSS —
         `astryx theme build` emits exactly `reset` and `astryx-theme`. -->
    <style>@layer reset, astryx-base, astryx-theme;</style>
    <!-- Per-workbench identity, one property. Graphite is the single theme across
         the catalog; `--wb-header-accent` is the only thing a workbench changes,
         and the theme's h1 rule reads it for the header rule.

         The selector is `[data-astryx-theme="graphite"]`, NOT `:root`. <Theme>
         renders a `display:contents` wrapper div carrying the same attribute, and
         graphite.css re-declares every token on `:scope` — which matches that
         wrapper. A `:root` override therefore never reaches the h1: the wrapper
         shadows it on the way down. This selector matches BOTH <html> and the
         wrapper, and being unlayered it outranks the layered `:scope` declaration
         on the same element. Two workbenches open side-by-side are told apart by
         this one rule. -->
    <style>[data-astryx-theme="graphite"] { --wb-header-accent: #2fb6a4; }</style>
    <!-- Page canvas and default text. Astryx's reset zeroes the body margin but
         declares no background, color, or family on it, so an unstyled node
         lands on the UA's own dark canvas in Times at UA white — and a contrast
         checker walking up from any text finds no opaque ancestor and assumes
         #ffffff. Selector is `[data-astryx-theme="graphite"] body` rather than
         plain `body`: graphite.css declares its tokens on `:scope` with <html>
         as the scope root, so the vars only resolve on <html> and its
         descendants. -->
    <style>
      [data-astryx-theme="graphite"] body {
        background: var(--color-background-body);
        font-family: var(--font-family-body);
        color: var(--color-text-primary);
      }
    </style>
    <!-- The collisions rail's PR chips are bare <button>s wrapping a Badge, so
         they inherit no Astryx focus ring. `:focus-visible` keeps the ring off
         mouse clicks; #2fb6a4 on the card ground measures 6.4:1, well past the
         3:1 non-text minimum. -->
    <style>
      [data-astryx-theme="graphite"] [data-wb-chip]:focus-visible {
        outline: 2px solid var(--color-accent);
        outline-offset: 2px;
        border-radius: var(--radius-full);
      }
    </style>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%232fb6a4'/></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
