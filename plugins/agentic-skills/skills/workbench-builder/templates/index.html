<!doctype html>
<!--
  workbench-builder · base-page skeleton
  Distilled from the verified eval-viewer workbench
  (the bundled workbench/templates/index.html in this skill).

  This is the Phase-2 starting point. Keep the engine (CDN tags, markdown
  pipeline, overlays, live indicator, post-swap rendering) intact and swap the
  {{ PLACEHOLDER }} domain regions for your workbench type — eval board, PR
  review room, trace replay, refactor cockpit, etc. The data model is the
  design; the regions below are just two worked examples of the named-SSE
  pattern so you can see the wiring before you replace them.

  No npm, no build step. Every dependency is one CDN <script>/<link> tag with a
  verified SRI hash. "Boring" means no toolchain — not no capability.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ WORKBENCH_TITLE }}</title>

  <!-- Inline SVG favicon: a real demo gets inspected, and a favicon 404 is
       harmless but noisy in the console. Ship the icon inline so there is none. -->
  <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'&gt;&lt;rect width='16' height='16' rx='4' fill='%230a0b0f'/&gt;&lt;circle cx='8' cy='8' r='3' fill='%2338bdf8'/&gt;&lt;/svg&gt;">

  <!-- ============================================================ CDN DEPS
       Each tag carries an SRI hash. CRITICAL: those hashes are over the
       UNCOMPRESSED bytes. jsDelivr serves curl a gzipped body, but the browser
       hashes the decompressed file. To re-derive a hash, force identity
       encoding so curl sees what the browser sees:
         curl -sL -H "Accept-Encoding: identity" "<url>" \
           | openssl dgst -sha384 -binary | openssl base64 -A
       Hash the compressed bytes and the browser blocks the script on a
       mismatch. ============================================================ -->

  <!-- htmx: the whole interaction model. GET swaps fragments; the SSE ext
       turns named server events into per-region re-fetches. -->
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
          integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.4"
          integrity="sha384-A986SAtodyH8eg8x8irJnYUk7i9inVQqYigD6qZ9evobksGNIXfeFvDwLSHcp31N"
          crossorigin="anonymous"></script>

  <!-- Chart.js: OPTIONAL — keep only if a region shows live charts. One
       self-contained UMD bundle (no d3); tooltips, legends, and animation come
       free in config, and a second chart type is ~6 lines. Delete if unused. -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"
          integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ"
          crossorigin="anonymous"></script>

  <!-- marked (GFM by default) renders the markdown the server hands back. -->
  <script src="https://cdn.jsdelivr.net/npm/marked@18.0.4/lib/marked.umd.min.js"
          integrity="sha384-QIom/Ao3tGhg4C4VY5VTDrHMTPzgsih5cGuY30rd/xp6hWQ+xIGIZ4kxhaQQY+PB"
          crossorigin="anonymous"></script>

  <!-- DOMPurify sanitizes the rendered HTML before it touches the DOM. -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.7/dist/purify.min.js"
          integrity="sha384-C5g1ZoYBpnvKyArNZI21kaBEk3egHOYfHj/cUOHmyJ7CSDMyNMyM+STqfkBt8m2Y"
          crossorigin="anonymous"></script>

  <!-- highlight.js for fenced code. Use the @highlightjs/cdn-assets BROWSER
       build — it sets window.hljs. highlight.js/lib/common.min.js is CommonJS
       (module.exports, no global) and fails with "require is not defined". -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css"
        integrity="sha384-wH75j6z1lH97ZOpMOInqhgKzFkAInZPPSPlZpYKYTOqsaizPvhQZmAtLcPKXpLyH"
        crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/highlight.min.js"
          integrity="sha384-RH2xi4eIQ/gjtbs9fUXM68sLSi99C7ZWBRX1vDrVv6GQXRibxXLbwO2NGZB74MbU"
          crossorigin="anonymous"></script>
  <!-- marked-highlight bridge. Use the NON-minified lib/index.umd.js: jsDelivr
       generates the .min.js on the fly, so its hash drifts and the file itself
       warns against SRI on dynamically generated builds. -->
  <script src="https://cdn.jsdelivr.net/npm/marked-highlight@2.2.4/lib/index.umd.js"
          integrity="sha384-BjBE0bY2PIGsLgdqaC1+iwO397c7jxwJdNszWabXYxrbMXBTS9QCPxXJElH8xOE/"
          crossorigin="anonymous"></script>

  <!-- mermaid renders ```mermaid fences. Sets globalThis.mermaid. -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.15.0/dist/mermaid.min.js"
          integrity="sha384-yQ4mmBBT+vhTAwjFH0toJXNYJ6O4usWnt6EPIdWwrRvx2V/n5lXuDZQwQFeSFydF"
          crossorigin="anonymous"></script>

  <!-- d3: ONLY if you swap Chart.js for Observable Plot. Plot externalizes d3
       (its UMD reads window.d3), so d3 must load FIRST. Chart.js needs none of
       this — prefer it unless you specifically want Plot. Uncomment to use:
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"
          integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i"
          crossorigin="anonymous"></script>
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* Compact dark design tokens. One palette drives panels, pills, charts,
       and overlays so a new region inherits the look for free. */
    :root {
      --bg:        #0a0b0f;
      --surface:   #13151c;
      --surface-2: #191c25;
      --border:    #262a35;
      --border-hi: #343a48;
      --ink:       #e7e9f0;
      --muted:     #888fa3;
      --faint:     #5a6072;
      --ok:        #4ade80;  /* pass / human / positive */
      --bad:       #f97066;  /* fail / error */
      --warn:      #fbbf24;  /* needs-attention */
      --signal:    #38bdf8;  /* accent / agent / live */
      --grid-line: #1a1d26;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font: 14px/1.55 "IBM Plex Sans", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 500px at 88% -10%, #15233010 0%, transparent 60%),
        var(--bg);
      padding: 22px 26px 40px;
    }

    header.top { display: flex; align-items: baseline; gap: 16px; margin-bottom: 22px; }
    h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800;
         font-size: 27px; letter-spacing: -0.02em; margin: 0; line-height: 1; }
    h1 .dot { color: var(--signal); }
    .tag { font-family: "JetBrains Mono", monospace; font-size: 11px;
           color: var(--faint); text-transform: uppercase; letter-spacing: 0.12em; }

    /* Live indicator — wired to htmx:sseOpen / htmx:sseError below. */
    .live { margin-left: auto; font-family: "JetBrains Mono", monospace; font-size: 11px;
            color: var(--muted); display: flex; align-items: center; gap: 7px;
            padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); }
    .live .led { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); transition: all .3s; }
    .live.on  .led { background: var(--ok);  box-shadow: 0 0 10px 1px var(--ok); animation: pulse 2s infinite; }
    .live.err .led { background: var(--bad); box-shadow: 0 0 10px 1px var(--bad); }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

    /* Two-column layout. Grid items default to min-width:auto and refuse to
       shrink below their content — wide tables/diagrams then escape the panel.
       min-width:0 on the columns lets them shrink; overflow-wrap handles text. */
    .grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,372px);
            gap: 18px; align-items: start; }
    .col-left, .col-right { min-width: 0; }
    @media (max-width: 920px) { .grid { grid-template-columns: 1fr; } }

    .panel { background: linear-gradient(180deg, var(--surface) 0%, #11131a 100%);
             border: 1px solid var(--border); border-radius: 12px;
             box-shadow: 0 1px 0 #ffffff06 inset, 0 18px 40px -28px #000;
             overflow: hidden; margin-bottom: 18px; min-width: 0; }
    .panel > header { margin: 0; padding: 11px 15px; border-bottom: 1px solid var(--border);
                      background: var(--surface-2); display: flex; align-items: center; gap: 9px; }
    .panel > header .lbl { font-family: "JetBrains Mono", monospace; font-size: 10.5px;
                           text-transform: uppercase; letter-spacing: 0.16em; color: var(--muted); }
    .panel > header .lbl::before { content: "\25B8  "; color: var(--signal); }
    .panel .body { padding: 13px 15px; min-width: 0; }

    /* Status pills. nowrap + a scrollable container, never overflow-wrap —
       squeezing overflow-wrap stacks letters vertically. */
    .pill { font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 9px; border-radius: 999px;
            display: inline-flex; align-items: center; gap: 5px; border: 1px solid transparent;
            white-space: nowrap; }
    .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%;
                    background: currentColor; flex: 0 0 auto; }
    .pill.ok   { color: var(--ok);   background: #4ade8016; border-color: #4ade8030; }
    .pill.bad  { color: var(--bad);  background: #f9706616; border-color: #f9706630; }
    .pill.warn { color: var(--warn); background: #fbbf2416; border-color: #fbbf2430; }

    /* Inline form controls for the two-way loop (human acts in the browser). */
    .btn { font-family: "JetBrains Mono", monospace; font-size: 10.5px; cursor: pointer;
           border: 1px solid var(--border); background: var(--surface-2); color: var(--muted);
           border-radius: 6px; padding: 4px 9px; transition: all .12s; }
    .btn:hover { color: var(--ink); border-color: var(--border-hi); transform: translateY(-1px); }
    .field { width: 100%; font: 12px/1.4 "IBM Plex Sans", sans-serif; background: var(--bg); color: var(--ink);
             border: 1px solid var(--border); border-radius: 7px; padding: 5px 8px; }
    .field:focus { outline: none; border-color: var(--signal); box-shadow: 0 0 0 3px #38bdf820; }

    /* Rendered-markdown surface. min-width:0 + overflow-wrap keep wide content
       inside a narrow column. */
    .md { font-size: 12.5px; min-width: 0; overflow-wrap: anywhere; }
    .md p { margin: 4px 0; }
    .md code { font-family: "JetBrains Mono", monospace; font-size: 11px;
               background: #ffffff0e; padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
    .md ul, .md ol { margin: 4px 0; padding-left: 18px; }
    .md a { color: var(--signal); }
    .md pre { background: #0d1117; border: 1px solid var(--border); border-radius: 7px;
              padding: 9px 11px; margin: 6px 0; overflow-x: auto; }
    .md pre code { background: none; padding: 0; font-size: 11px; line-height: 1.5; }
    .md pre.mermaid { background: #0d1117; text-align: center; }
    .md pre.mermaid svg { max-width: 100%; height: auto; }
    .md table { border-collapse: collapse; margin: 6px 0; font-size: 11.5px; width: 100%; }
    .md th, .md td { border: 1px solid var(--border); padding: 3px 8px; text-align: left; }
    .md th { background: var(--surface-2); font-family: "JetBrains Mono", monospace;
             font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }

    /* Embed chips: wide artifacts (tables, diagrams) collapse to a compact
       opener so narrow columns stay tidy; click opens the modal. */
    .embed-chip { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; max-width: 100%;
                  font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--muted);
                  background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px;
                  padding: 5px 9px; margin: 6px 0; transition: all .14s; text-align: left; }
    .embed-chip:hover { border-color: var(--signal); color: var(--ink);
                        transform: translateY(-1px); box-shadow: 0 6px 18px -10px var(--signal); }
    .embed-chip .ec-ic { color: var(--signal); font-size: 13px; line-height: 1; }
    .embed-chip .ec-dim { color: var(--faint); }
    .embed-chip .ec-go { margin-left: auto; color: var(--faint); font-size: 9px;
                         text-transform: uppercase; letter-spacing: 0.1em; }
    .embed-diagram { flex-direction: column; align-items: stretch; gap: 0; padding: 0; overflow: hidden; width: 100%; }
    .embed-diagram .ec-thumb { background: #0d1117; padding: 8px; max-height: 104px;
                               overflow: hidden; display: flex; justify-content: center; align-items: center; }
    .embed-diagram .ec-thumb svg { max-width: 100%; max-height: 88px; height: auto; opacity: .92; }
    .embed-diagram .ec-bar { display: flex; align-items: center; gap: 7px;
                             padding: 6px 10px; border-top: 1px solid var(--border); }

    /* Overlays: modal (centered artifact) + sheet (right-side full disclosure). */
    .ov { position: fixed; inset: 0; display: none; }
    .ov.open { display: block; }
    .ov-scrim { position: absolute; inset: 0; background: #05060ac9; backdrop-filter: blur(5px); }
    .ov-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 10px;
               padding: 11px 15px; background: var(--surface-2); border-bottom: 1px solid var(--border); }
    .ov-title { font-family: "JetBrains Mono", monospace; font-size: 10.5px; text-transform: uppercase;
                letter-spacing: 0.14em; color: var(--muted); }
    .ov-title::before { content: "\25B8  "; color: var(--signal); }
    .ov-close { margin-left: auto; font-family: "JetBrains Mono", monospace; font-size: 9.5px; cursor: pointer;
                background: transparent; color: var(--muted); border: 1px solid var(--border);
                border-radius: 6px; padding: 3px 9px; transition: all .12s; }
    .ov-close:hover { color: var(--signal); border-color: var(--signal); }
    .ov-body { padding: 16px 18px; }

    #modal { z-index: 70; }
    #modal .ov-card { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(.96);
                      background: var(--surface); border: 1px solid var(--border-hi); border-radius: 16px;
                      max-width: 92vw; max-height: 90vh; overflow: auto; box-shadow: 0 40px 100px -24px #000;
                      opacity: 0; transition: opacity .18s, transform .18s; }
    #modal.open .ov-card { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    #modal .ov-body { display: grid; place-items: center; }
    #modal .ov-body svg { width: auto; max-width: 86vw; height: auto; max-height: 78vh; }

    #sheet { z-index: 62; }
    #sheet .ov-card { position: absolute; top: 0; right: 0; height: 100%; width: min(480px, 94vw);
                      background: var(--surface); border-left: 1px solid var(--border-hi);
                      box-shadow: -30px 0 80px -30px #000; overflow: auto;
                      transform: translateX(100%); transition: transform .26s cubic-bezier(.4,0,.2,1); }
    #sheet.open .ov-card { transform: translateX(0); }
    #sheet .ov-body .md { font-size: 13px; }
  </style>
</head>

<!--
  ============================================================== NAMED-SSE WIRING
  ONE EventSource for the entire page: the htmx SSE extension on <body> opens it
  via sse-connect="/events". The server emits NAMED events — `event: <region>\n
  data: stale`. Each live region below carries hx-trigger="sse:<region>" so a
  named event re-fetches EXACTLY that one partial over a normal GET (hx-get).

  SSE is an INVALIDATION SIGNAL, not data transport: the event is tiny and
  payload-free; the HTML always arrives over the GET. A server-side fan-out of
  subscriber queues backs publish(*targets), so both the human (htmx POST) and
  the agent (terminal httpx -> SQLite -> publish) re-render the same regions
  live, with no client-side state model.
  ============================================================================ -->
<body hx-ext="sse" sse-connect="/events">
  <header class="top">
    <h1>{{ WORKBENCH_TITLE }}<span class="dot">.</span></h1>
    <span class="tag">disposable &middot; 127.0.0.1 &middot; this session only</span>
    <span class="live" id="live"><span class="led"></span><span id="live-txt">connecting&hellip;</span></span>
  </header>

  <div class="grid" id="grid">
    <div class="col-left">
      <!-- ============================================================ {{ PLACEHOLDER }}
           PRIMARY REGION — the main artifact for this workbench type (eval
           board, PR diff list, trace timeline, refactor file tree, ...). Here
           it is the `board` region that app.py serves at /partials/board.
           hx-trigger="load" fetches once on page load; sse:board re-fetches
           when the server publishes that named event. Rename the region +
           endpoint together to match your data model — the string in
           hx-get="/partials/<region>", hx-trigger="sse:<region>", and the
           server's publish("<region>") must all match.
           ============================================================ -->
      <section class="panel">
        <header><span class="lbl">{{ PRIMARY_REGION_LABEL }}</span></header>
        <div id="board"
             hx-get="/partials/board"
             hx-trigger="load, sse:board"></div>
      </section>
    </div>

    <div class="col-right">
      <!-- ============================================================ {{ PLACEHOLDER }}
           SECONDARY REGION — summary / stats / detail panel. Here it is the
           `summary` region app.py serves at /partials/summary. Keep the
           Chart.js block only if this region renders live charts; otherwise
           drop the <canvas> elements and the renderChart() call far below.
           ============================================================ -->
      <section class="panel">
        <header><span class="lbl">{{ SECONDARY_REGION_LABEL }}</span></header>
        <div class="body">
          <div id="summary"
               hx-get="/partials/summary"
               hx-trigger="load, sse:summary"></div>
          <!-- OPTIONAL live chart — delete if no Chart.js -->
          <canvas id="chart-main" style="max-height: 150px; margin-top: 14px;"></canvas>
        </div>
      </section>

      <!-- ============================================================ {{ PLACEHOLDER }}
           THE LOOP REGION — what makes this a workbench, not a dashboard.
           The human steers from the browser (htmx POST -> SQLite -> fragment +
           publish SSE); the agent answers from the terminal (httpx -> SQLite ->
           publish SSE). Both share one SQLite file. Render the human->agent
           request queue and the agent's responses here so the two-way channel
           is visible and live. Replace with your domain's loop surface.
           ============================================================ -->
      <section class="panel">
        <header><span class="lbl">{{ LOOP_REGION_LABEL }}</span></header>
        <div class="body">
          <div id="queue"
               hx-get="/partials/queue"
               hx-trigger="load, sse:queue"></div>
          <!-- Example human->agent steer: a whole-board ask POSTs to
               /items/ask (item_id nullable = board-wide); the server inserts a
               queued request, publishes sse:queue, and returns the queue
               partial so this region swaps in place. Other tabs follow via SSE.
               app.py's per-item ask form posts to /items/<id>/ask instead. -->
          <form hx-post="/items/ask"
                hx-target="#queue" hx-swap="innerHTML"
                hx-on::after-request="this.reset()"
                style="display:flex; gap:6px; margin-top:10px;">
            <input class="field" name="body" placeholder="ask the agent&hellip;" autocomplete="off">
            <button class="btn" type="submit">send</button>
          </form>
        </div>
      </section>
    </div>
  </div>

  <!-- Centered modal: one visual artifact (a diagram or a wide table). -->
  <div class="ov" id="modal">
    <div class="ov-scrim" data-close></div>
    <div class="ov-card">
      <div class="ov-head"><span class="ov-title">view</span><button class="ov-close" data-close>&times; esc</button></div>
      <div class="ov-body"></div>
    </div>
  </div>

  <!-- Right sheet: full-width text disclosure (a note or event rendered wide). -->
  <div class="ov" id="sheet">
    <div class="ov-scrim" data-close></div>
    <div class="ov-card">
      <div class="ov-head"><span class="ov-title">detail</span><button class="ov-close" data-close>&times; esc</button></div>
      <div class="ov-body"></div>
    </div>
  </div>

  <script>
    /* ============================================================ MARKDOWN ENGINE
       marked (GFM) + marked-highlight -> highlight.js for fenced code, mermaid
       for ```mermaid fences, DOMPurify to sanitize. The whole pipeline re-runs
       on htmx:afterSwap so SSE-swapped fragments render too. */
    mermaid.initialize({
      startOnLoad: false, theme: 'dark', securityLevel: 'strict',
      themeVariables: { fontFamily: 'JetBrains Mono, monospace', fontSize: '12px',
                        primaryColor: '#191c25', primaryBorderColor: '#38bdf8',
                        lineColor: '#5a6072', primaryTextColor: '#e7e9f0' },
    });
    marked.use(markedHighlight.markedHighlight({
      langPrefix: 'hljs language-',
      highlight(code, lang) {
        // Leave mermaid fences untouched here — they are re-emitted as
        // <pre class="mermaid"> below and rendered after the HTML lands.
        if (lang === 'mermaid') return code;
        const l = hljs.getLanguage(lang) ? lang : 'plaintext';
        return hljs.highlight(code, { language: l }).value;
      },
    }));
    marked.use({ renderer: {
      code(token) {
        if (token.lang === 'mermaid') {
          return `<pre class="mermaid">${token.text
            .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</pre>`;
        }
        return false;  // fall through to marked-highlight for every other lang
      },
    }});

    let mmid = 0;
    const mdSrc = new Map();   // .md element -> raw markdown source (for re-render in a sheet)
    const embeds = new Map();  // chip id -> full artifact node (for the modal)
    let embedSeq = 0;

    // Core renderer. embed=true -> tables & diagrams collapse to chips so a
    // narrow column stays tidy. embed=false -> render everything inline (the
    // wide sheet). mermaid.run() must come AFTER the sanitized HTML is in the
    // DOM and AFTER DOMPurify keeps <pre class> (ADD_TAGS / ADD_ATTR below).
    async function renderInto(node, src, embed) {
      node.innerHTML = DOMPurify.sanitize(marked.parse((src || '').trim()),
        { ADD_TAGS: ['pre'], ADD_ATTR: ['class'] });
      const diagrams = node.querySelectorAll('pre.mermaid:not([data-mm])');
      diagrams.forEach(d => { d.id = 'mm-' + (mmid++); d.dataset.mm = '1'; });
      if (diagrams.length) await mermaid.run({ nodes: diagrams }).catch(() => {});
      if (!embed) return;
      node.querySelectorAll('table').forEach(t => {
        const rows = Math.max(0, t.rows.length - 1), cols = t.rows[0]?.cells.length || 0;
        t.replaceWith(tableChip(t.cloneNode(true), rows, cols));
      });
      node.querySelectorAll('pre.mermaid').forEach(d => d.replaceWith(diagramChip(d)));
    }

    function tableChip(full, rows, cols) {
      const id = 'e' + (embedSeq++); embeds.set(id, full);
      const b = document.createElement('button');
      b.className = 'embed-chip'; b.dataset.embed = id; b.dataset.title = `table · ${rows}×${cols}`;
      b.innerHTML = `<span class="ec-ic">▦</span><span>table</span>` +
                    `<span class="ec-dim">${rows}×${cols}</span><span class="ec-go">open ⤢</span>`;
      return b;
    }
    function diagramChip(pre) {
      const id = 'e' + (embedSeq++); embeds.set(id, pre.cloneNode(true));
      const b = document.createElement('button');
      b.className = 'embed-chip embed-diagram'; b.dataset.embed = id; b.dataset.title = 'diagram';
      const thumb = document.createElement('div'); thumb.className = 'ec-thumb';
      const svg = pre.querySelector('svg');
      if (svg) { const cl = svg.cloneNode(true); cl.removeAttribute('width'); cl.removeAttribute('height'); thumb.appendChild(cl); }
      const bar = document.createElement('div'); bar.className = 'ec-bar';
      bar.innerHTML = `<span class="ec-ic">◫</span><span>diagram</span><span class="ec-go">expand ⤢</span>`;
      b.append(thumb, bar);
      return b;
    }

    // Walk freshly-swapped HTML and render any unprocessed .md blocks. Server
    // partials emit raw markdown inside <div class="md">…</div>; this turns it
    // into rendered, sanitized HTML.
    async function renderMarkdown(root) {
      const els = (root || document).querySelectorAll('.md:not([data-md])');
      for (const el of els) {
        const src = el.textContent;
        mdSrc.set(el, src);
        el.dataset.md = '1';
        await renderInto(el, src, true);
      }
    }

    /* ---- overlays ---- */
    function openModal(title, node) {
      const m = document.getElementById('modal');
      m.querySelector('.ov-title').textContent = title;
      const body = m.querySelector('.ov-body'); body.replaceChildren(node);
      const svg = body.querySelector('svg');
      if (svg) { svg.style.maxWidth = 'none'; svg.style.width = 'min(86vw, 1100px)';
                 svg.style.height = 'auto'; svg.setAttribute('preserveAspectRatio', 'xMidYMid meet'); }
      m.classList.add('open');
    }
    async function openSheet(title, src) {
      const s = document.getElementById('sheet');
      s.querySelector('.ov-title').textContent = title;
      const body = s.querySelector('.ov-body');
      const holder = document.createElement('div'); holder.className = 'md';
      body.replaceChildren(holder);
      await renderInto(holder, src, false);   // full width, no chips
      s.classList.add('open');
    }
    function closeOverlays() {
      document.getElementById('modal').classList.remove('open');
      document.getElementById('sheet').classList.remove('open');
    }

    document.addEventListener('click', (e) => {
      const chip = e.target.closest('.embed-chip');
      if (chip) { const n = embeds.get(chip.dataset.embed);
                  if (n) openModal(chip.dataset.title, n.cloneNode(true)); return; }
      // {{ PLACEHOLDER }} — wire your own "open in sheet" affordances here.
      // e.g. a clickable list row that discloses its full markdown:
      const row = e.target.closest('[data-sheet]');
      if (row) { const md = row.querySelector('.md');
                 if (md) openSheet(row.dataset.sheet || 'detail', mdSrc.get(md) ?? md.textContent); return; }
      if (e.target.closest('[data-close]')) closeOverlays();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlays(); });

    /* ============================================================ LIVE CHARTS
       OPTIONAL. Chart.js instance lifecycle: you cannot new Chart() twice on
       one canvas — create once, then chart.update() with new data (animates).
       Delete this whole block if no region uses charts. */
    Chart.defaults.color = '#888fa3';
    Chart.defaults.font.family = 'JetBrains Mono, monospace';
    Chart.defaults.font.size = 10;
    let mainChart;
    async function renderChart() {
      const canvas = document.getElementById('chart-main');
      if (!canvas) return;
      // {{ PLACEHOLDER }} — fetch your series from a /data/<name> JSON endpoint.
      const { labels = [], values = [] } = await (await fetch('/data/chart-main')).json().catch(() => ({}));
      if (!mainChart) {
        mainChart = new Chart(canvas, {
          type: 'line',
          data: { labels, datasets: [{ data: values, borderColor: '#38bdf8',
                  backgroundColor: 'rgba(56,189,248,0.18)', fill: true, tension: 0.35,
                  borderWidth: 2, pointRadius: 2, pointHoverRadius: 5 }] },
          options: { responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false },
              tooltip: { backgroundColor: '#13151c', borderColor: '#262a35', borderWidth: 1, cornerRadius: 8 } },
            scales: { x: { grid: { color: '#1a1d26' } },
                      y: { beginAtZero: true, grid: { color: '#1a1d26' }, ticks: { precision: 0 } } } },
        });
      } else {
        mainChart.data.labels = labels;
        mainChart.data.datasets[0].data = values;
        mainChart.update();
      }
    }

    /* ============================================================ LIVE + SWAPS
       The live indicator is driven entirely by the SSE connection lifecycle. */
    const live = document.getElementById('live'), liveTxt = document.getElementById('live-txt');
    document.body.addEventListener('htmx:sseOpen',  () => { live.className = 'live on';  liveTxt.textContent = 'live'; });
    document.body.addEventListener('htmx:sseError', () => { live.className = 'live err'; liveTxt.textContent = 'reconnecting…'; });

    // Re-run the markdown pipeline on EVERY swap so SSE-delivered fragments
    // render the same as the initial load. Refresh dependent charts too.
    document.body.addEventListener('htmx:afterSwap', (e) => {
      renderMarkdown(e.target);
      if (e.target.id === 'summary') renderChart();
    });

    renderChart();
  </script>
</body>
</html>
