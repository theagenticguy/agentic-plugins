<!doctype html>
<!--
  doc-review workbench · select text -> comment / redline -> the agent reads & resolves
  Light default theme. htmx + SSE only — no markdown pipeline (the doc is HTML,
  comments are short text). Two-way loop over one SQLite file.

  Char-perfect anchoring: the server stores each block's plain text after
  html.unescape + whitespace-collapse, and the partial renders THAT exact string.
  So the browser's textContent of a block === the server's stored text, char for
  char, and a selection's offsets index the identical string on both sides.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'&gt;&lt;rect width='16' height='16' rx='4' fill='%23e8edf1'/&gt;&lt;circle cx='8' cy='8' r='3' fill='%230a6961'/&gt;&lt;/svg&gt;">

  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
          integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.4"
          integrity="sha384-A986SAtodyH8eg8x8irJnYUk7i9inVQqYigD6qZ9evobksGNIXfeFvDwLSHcp31N"
          crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ── Graphite design system — light mode only ──
       Cool blue-gray surfaces, teal + navy accents, system serif over mono data.
       One token set; color is rationed to the accent and the annotation states. */
    :root {
      /* Surfaces: cool blue-gray ladder */
      --bg-0:#e8edf1; --bg-1:#fcfdfe; --bg-2:#dadfe5;
      /* Borders */
      --line:#c7cfd7; --line-strong:#a9b4bf;
      /* Text: 4-stop hierarchy */
      --ink:#0b0f14; --ink-soft:#1c232b; --ink-mute:#3b4753; --ink-low:#586471;
      /* Accents (carry meaning) */
      --accent:#0a6961; --accent-soft:rgba(10,105,97,0.12); --accent-2:#274d7a;
      /* Atmosphere */
      --grid-line:rgba(120,134,150,0.20);
      --glow-1:rgba(10,105,97,0.07); --glow-2:rgba(39,77,122,0.06);
      /* Typography */
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      --serif: "Tiempos Headline", "Iowan Old Style", "Charter", Georgia, "Times New Roman", serif;
      /* Radius */
      --radius-sm:2px; --radius-md:4px;

      /* Annotation semantics, mapped onto the Graphite status hues.
         Color appears only when it means something. */
      --comment:#274d7a;    --comment-soft:rgba(39,77,122,0.12);
      --redline:#9a3b33;    --redline-soft:rgba(154,59,51,0.12);
      --done:#0a6961;       --done-soft:rgba(10,105,97,0.12);
      --warn:#7a5512;       --warn-soft:rgba(122,85,18,0.12);
      --quote:rgba(122,134,150,0.16); --quote-rule:var(--line-strong);
    }
    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; }
    body {
      font:15px/1.62 var(--sans); color:var(--ink);
      background:var(--bg-0); padding:24px 28px 56px;
      background-image:
        radial-gradient(1100px 600px at 78% -8%, var(--glow-1), transparent 62%),
        radial-gradient(800px 500px at 8% 4%, var(--glow-2), transparent 62%);
      background-attachment:fixed;
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    }
    header.top { display:flex; align-items:baseline; gap:12px; margin:0 auto 18px; max-width:1180px; }
    h1.app { font-family:var(--serif); font-weight:500; font-size:21px; margin:0; letter-spacing:-0.02em; }
    .tag { font-family:var(--mono); font-size:10.5px; color:var(--ink-low);
           text-transform:uppercase; letter-spacing:0.16em; }
    .live { margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--ink-mute);
            display:flex; align-items:center; gap:6px; padding:3px 11px; border:1px solid var(--line);
            border-radius:999px; background:var(--bg-1); text-transform:uppercase; letter-spacing:0.1em; }
    .live .led { width:7px; height:7px; border-radius:50%; background:var(--ink-low); transition:all .3s; }
    .live.on .led { background:var(--done); box-shadow:0 0 8px 1px var(--accent-soft); animation:pulse 2.4s infinite; }
    .live.err .led { background:var(--redline); }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }

    .grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,360px); gap:26px;
            align-items:start; max-width:1180px; margin:0 auto; }
    @media (max-width:940px) { .grid { grid-template-columns:1fr; } }
    .col-left, .col-right { min-width:0; }
    .col-right { position:sticky; top:18px; }

    ::selection { background:var(--accent); color:var(--bg-1); }
    ::-webkit-scrollbar { width:8px; height:8px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--line-strong); border-radius:100px; }
    ::-webkit-scrollbar-thumb:hover { background:var(--ink-low); }

    /* ---- the memo (reads like a page, not a panel) ---- */
    .paper { background:var(--bg-1); border:1px solid var(--line); border-radius:var(--radius-md);
             padding:34px 40px; }
    .memo { font-size:15.5px; line-height:1.68; max-width:64ch; color:var(--ink-soft); }
    .blk { margin:0 0 13px; min-width:0; overflow-wrap:anywhere; }
    .blk-h1 { font-family:var(--serif); font-size:27px; font-weight:500; line-height:1.25;
              letter-spacing:-0.02em; margin:0 0 4px; color:var(--ink); }
    .blk-h2 { font-family:var(--serif); font-size:20px; font-weight:500; margin:30px 0 8px;
              padding-top:16px; border-top:1px solid var(--line); letter-spacing:-0.01em; color:var(--ink); }
    .blk-h3 { font-size:11px; font-weight:500; color:var(--ink-low); margin:18px 0 4px;
              font-family:var(--mono); text-transform:uppercase; letter-spacing:0.16em; }
    .blk-li { margin-left:20px; list-style:disc; display:list-item; }
    .blk-blockquote { border-left:3px solid var(--line-strong); padding-left:16px; color:var(--ink);
                      font-family:var(--serif); font-size:18px; font-style:italic; }
    .blk-cite { display:block; font-size:12.5px; color:var(--ink-low); font-style:normal; font-family:var(--mono); }
    .blk-caption, .blk-th, .blk-td { font-size:13px; color:var(--ink-mute); }
    .blk-td, .blk-th { display:block; }

    /* ---- annotation highlights ---- */
    mark.mk { background:transparent; color:inherit; border-radius:1px; padding:0; cursor:pointer;
              transition:background .12s; }
    mark.mk-comment { background:var(--comment-soft); box-shadow:inset 0 -2px 0 var(--comment); }
    mark.mk-redline { background:var(--redline-soft); box-shadow:inset 0 -2px 0 var(--redline); }
    mark.mk-done    { background:var(--done-soft); box-shadow:inset 0 -2px 0 var(--done); }
    mark.mk:hover   { filter:brightness(.97); }

    /* ---- floating action bar on selection ---- */
    #seltool { position:absolute; z-index:80; display:none; gap:0; border-radius:var(--radius-md); overflow:hidden;
               background:var(--ink); box-shadow:0 6px 24px -6px rgba(11,15,20,0.45); }
    #seltool.show { display:flex; }
    #seltool button { font-family:var(--sans); font-size:12.5px; font-weight:500; cursor:pointer;
                      border:none; padding:7px 13px; color:var(--bg-1); background:transparent; transition:background .1s; }
    #seltool button + button { border-left:1px solid rgba(255,255,255,0.14); }
    #seltool .b-comment:hover { background:var(--comment); }
    #seltool .b-redline:hover { background:var(--redline); }

    /* ---- compose popover ---- */
    #compose { position:absolute; z-index:85; display:none; width:340px; background:var(--bg-1);
               border:1px solid var(--line-strong); border-radius:var(--radius-md); box-shadow:0 18px 50px -14px rgba(11,15,20,0.30); }
    #compose.show { display:block; }
    #compose .c-head { font-family:var(--mono); font-size:10px; text-transform:uppercase;
                       letter-spacing:0.16em; padding:10px 14px; border-bottom:1px solid var(--line);
                       display:flex; align-items:center; gap:8px; }
    #compose .c-head .dot { width:8px; height:8px; border-radius:50%; }
    #compose.k-comment .c-head { color:var(--comment); } #compose.k-comment .dot { background:var(--comment); }
    #compose.k-redline .c-head { color:var(--redline); } #compose.k-redline .dot { background:var(--redline); }
    /* the "what's selected" indicator */
    #compose .c-sel { margin:12px 14px 0; }
    #compose .c-sel-lbl { font-family:var(--mono); font-size:9px; text-transform:uppercase;
                          letter-spacing:0.16em; color:var(--ink-low); display:flex; justify-content:space-between; margin-bottom:4px; }
    #compose .c-quote { font-size:13px; line-height:1.45; color:var(--ink-soft); background:var(--quote);
                        box-shadow:inset 0 -2px 0 var(--quote-rule); border-radius:var(--radius-sm); padding:6px 9px;
                        max-height:88px; overflow:auto; }
    #compose textarea { width:calc(100% - 28px); margin:10px 14px 0; display:block;
                        font:13.5px/1.45 var(--sans); color:var(--ink); background:var(--bg-1);
                        border:1px solid var(--line-strong); border-radius:var(--radius-md); padding:8px 10px; resize:vertical; min-height:54px; }
    #compose textarea:focus { outline:none; border-color:var(--comment); box-shadow:0 0 0 3px var(--comment-soft); }
    #compose.k-redline textarea:focus { border-color:var(--redline); box-shadow:0 0 0 3px var(--redline-soft); }
    #compose .c-sugg-lbl { font-family:var(--mono); font-size:9px; text-transform:uppercase;
                           letter-spacing:0.16em; color:var(--ink-low); margin:10px 14px 0; }
    #compose .c-actions { display:flex; gap:8px; justify-content:flex-end; padding:12px 14px 14px; }
    .btn { font-family:var(--sans); font-size:12.5px; cursor:pointer; border:1px solid var(--line-strong);
           background:var(--bg-1); color:var(--ink-mute); border-radius:var(--radius-md); padding:6px 13px; transition:all .12s; }
    .btn:hover { color:var(--ink); border-color:var(--ink-low); }
    .btn.go { color:var(--bg-1); border-color:transparent; font-weight:500; }
    #compose.k-comment .btn.go { background:var(--comment); } #compose.k-redline .btn.go { background:var(--redline); }

    /* ---- annotation cards ---- */
    .rail-head { display:flex; align-items:baseline; gap:8px; margin:0 0 14px;
                 padding-bottom:9px; border-bottom:1px solid var(--line); }
    .rail-head h2 { font-family:var(--serif); font-size:17px; font-weight:500; margin:0; letter-spacing:-0.01em; color:var(--ink); }
    .rail-head .count { font-family:var(--mono); font-size:11px; color:var(--ink-low); margin-left:auto;
                        letter-spacing:0.06em; }
    .empty { color:var(--ink-low); font-size:14px; padding:18px 0; font-family:var(--serif); font-style:italic; }
    .empty b { color:var(--ink-mute); font-style:normal; }
    .ann { background:var(--bg-1); border:1px solid var(--line); border-left-width:3px; border-radius:var(--radius-md);
           padding:11px 13px; margin-bottom:10px; transition:border-color .14s, transform .1s, background .14s; scroll-margin-top:16px; }
    .ann:hover { border-color:var(--line-strong); }
    .ann-comment { border-left-color:var(--comment); }
    .ann-redline { border-left-color:var(--redline); }
    .ann.ann-addressed, .ann.ann-wontfix { opacity:.72; border-left-color:var(--done); }
    .ann.ann-wontfix { border-left-color:var(--ink-low); }
    .ann.flash { box-shadow:0 0 0 3px var(--accent-soft); transform:translateX(-2px); }
    .ann-top { display:flex; align-items:center; gap:7px; margin-bottom:7px; }
    .chip { font-family:var(--mono); font-size:9px; font-weight:600; text-transform:uppercase;
            letter-spacing:0.08em; padding:2px 7px; border-radius:var(--radius-sm); white-space:nowrap; }
    .chip.comment { color:var(--comment); background:var(--comment-soft); }
    .chip.redline { color:var(--redline); background:var(--redline-soft); }
    .chip.open { color:var(--warn); background:var(--warn-soft); }
    .chip.addressed { color:var(--done); background:var(--done-soft); }
    .chip.wontfix { color:var(--ink-low); background:var(--bg-2); }
    .ann-sec { font-size:10px; color:var(--ink-low); margin-left:2px; overflow:hidden; text-overflow:ellipsis;
               white-space:nowrap; font-family:var(--mono); letter-spacing:0.04em; }
    .ann-del { margin-left:auto; }
    .ann-del .x { background:none; border:none; color:var(--ink-low); font-size:15px; cursor:pointer; line-height:1; padding:0 2px; }
    .ann-del .x:hover { color:var(--redline); }
    .ann-quote { margin:0 0 6px; font-size:12.5px; color:var(--ink-mute); background:var(--quote);
                 box-shadow:inset 0 -2px 0 var(--quote-rule); border-radius:var(--radius-sm); padding:4px 8px; }
    .ann-comment-txt { margin:0 0 6px; font-size:13.5px; color:var(--ink-soft); }
    .ann-redline-box { font-size:13px; background:var(--redline-soft); border-radius:var(--radius-md); padding:6px 9px; margin-top:4px; color:var(--ink-soft); }
    .ann-redline-box .rl-lbl { font-family:var(--mono); font-size:9px; color:var(--redline);
                               text-transform:uppercase; letter-spacing:0.08em; margin-right:6px; }
    .ann-agent { font-size:13px; background:var(--done-soft); border-radius:var(--radius-md); padding:7px 9px; margin-top:7px; color:var(--ink-soft); }
    .ann-agent .ag-lbl { font-family:var(--mono); font-size:9px; color:var(--done);
                         text-transform:uppercase; letter-spacing:0.08em; margin-right:6px; font-weight:600; }
    .hint { font-size:13px; color:var(--ink-low); margin:0 0 16px; }
    .hint b { color:var(--ink-mute); }
  </style>
</head>

<body hx-ext="sse" sse-connect="/events">
  <header class="top">
    <h1 class="app">{{ title }}</h1>
    <span class="tag">disposable &middot; 127.0.0.1</span>
    <span class="live" id="live"><span class="led"></span><span id="live-txt">connecting&hellip;</span></span>
  </header>

  <div class="grid">
    <div class="col-left">
      <p class="hint">Select any text to <b>comment</b> or <b>redline</b>. The agent reads your notes from the terminal and resolves them here, live.</p>
      <div class="paper">
        <div id="document" hx-get="/partials/document" hx-trigger="load, sse:document"></div>
      </div>
    </div>

    <div class="col-right">
      <div id="annotations" hx-get="/partials/annotations" hx-trigger="load, sse:annotations"></div>
    </div>
  </div>

  <!-- selection action bar -->
  <div id="seltool">
    <button class="b-comment" data-kind="comment">Comment</button>
    <button class="b-redline" data-kind="redline">Redline</button>
  </div>

  <!-- compose popover -->
  <div id="compose">
    <form id="compose-form" hx-post="/annotate" hx-target="#annotations" hx-swap="innerHTML"
          hx-on::after-request="closeCompose()">
      <div class="c-head"><span class="dot"></span><span id="c-kind-label">comment</span></div>
      <div class="c-sel">
        <div class="c-sel-lbl"><span>selected text</span><span id="c-range"></span></div>
        <div class="c-quote" id="c-quote"></div>
      </div>
      <input type="hidden" name="kind"      id="f-kind">
      <input type="hidden" name="block_id"  id="f-block">
      <input type="hidden" name="start_off" id="f-start">
      <input type="hidden" name="end_off"   id="f-end">
      <input type="hidden" name="quote"     id="f-quote">
      <textarea name="comment" id="f-comment" placeholder="your comment…"></textarea>
      <div class="c-sugg-lbl" id="c-sugg-lbl" style="display:none;">suggested replacement</div>
      <textarea name="suggestion" id="f-sugg" style="display:none;"></textarea>
      <div class="c-actions">
        <button type="button" class="btn" onclick="closeCompose()">cancel</button>
        <button type="submit" class="btn go" id="c-submit">save</button>
      </div>
    </form>
  </div>

  <script>
    const live = document.getElementById('live'), liveTxt = document.getElementById('live-txt');
    document.body.addEventListener('htmx:sseOpen',  () => { live.className='live on';  liveTxt.textContent='live'; });
    document.body.addEventListener('htmx:sseError', () => { live.className='live err'; liveTxt.textContent='reconnecting…'; });

    const seltool = document.getElementById('seltool');
    const compose = document.getElementById('compose');
    let pending = null;  // {block_id, start, end, quote}

    /* Char offset of (node, nodeOffset) within the block's textContent. Walk the
       block's text nodes in order, summing lengths. Because the rendered block's
       textContent is byte-identical to the server's stored text, this offset
       indexes the same string the server stored — so the painted <mark> lands on
       exactly the selected characters. */
    function offsetInBlock(block, node, nodeOffset) {
      let total = 0;
      const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT, null);
      let n;
      while ((n = walker.nextNode())) {
        if (n === node) return total + nodeOffset;
        total += n.textContent.length;
      }
      return total;
    }

    function onSelect() {
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed || sel.rangeCount === 0) { hideTool(); return; }
      const range = sel.getRangeAt(0);
      const block = range.startContainer.parentElement?.closest('[data-block]');
      const endBlock = range.endContainer.parentElement?.closest('[data-block]');
      if (!block || block !== endBlock) { hideTool(); return; }   // one block only
      const start = offsetInBlock(block, range.startContainer, range.startOffset);
      const end   = offsetInBlock(block, range.endContainer, range.endOffset);
      const quote = block.textContent.slice(start, end);  // authoritative: from stored text
      if (end <= start || !quote.trim()) { hideTool(); return; }
      pending = { block_id: block.dataset.block, start, end, quote };
      const rect = range.getBoundingClientRect();
      seltool.style.top  = (window.scrollY + rect.top - 40) + 'px';
      seltool.style.left = (window.scrollX + rect.left) + 'px';
      seltool.classList.add('show');
    }
    function hideTool() { seltool.classList.remove('show'); }

    document.addEventListener('mouseup', () => setTimeout(onSelect, 1));
    document.addEventListener('scroll', hideTool, true);

    seltool.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('mousedown', (e) => { e.preventDefault(); if (pending) openCompose(btn.dataset.kind); });
    });

    function openCompose(kind) {
      hideTool();
      const redline = kind === 'redline';
      compose.className = redline ? 'k-redline show' : 'k-comment show';
      document.getElementById('f-kind').value = kind;
      document.getElementById('f-block').value = pending.block_id;
      document.getElementById('f-start').value = pending.start;
      document.getElementById('f-end').value = pending.end;
      document.getElementById('f-quote').value = pending.quote;
      document.getElementById('c-quote').textContent = pending.quote;
      document.getElementById('c-range').textContent = `chars ${pending.start}–${pending.end}`;
      document.getElementById('c-kind-label').textContent = redline ? 'redline' : 'comment';
      const sugg = document.getElementById('f-sugg'), suggLbl = document.getElementById('c-sugg-lbl');
      sugg.style.display = redline ? 'block' : 'none';
      suggLbl.style.display = redline ? 'block' : 'none';
      if (redline) sugg.value = pending.quote;
      const rect = window.getSelection().getRangeAt(0).getBoundingClientRect();
      compose.style.top  = (window.scrollY + rect.bottom + 8) + 'px';
      compose.style.left = (window.scrollX + Math.min(rect.left, window.innerWidth - 360)) + 'px';
      document.getElementById('f-comment').focus();
    }
    function closeCompose() {
      compose.classList.remove('show');
      document.getElementById('f-comment').value = '';
      document.getElementById('f-sugg').value = '';
      pending = null;
      window.getSelection().removeAllRanges();
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeCompose(); hideTool(); } });
    document.addEventListener('mousedown', (e) => {
      if (!compose.contains(e.target) && !seltool.contains(e.target) && compose.classList.contains('show')) {
        if (!e.target.closest('[data-block]')) closeCompose();
      }
    });

    /* click a highlight → flash its card */
    document.addEventListener('click', (e) => {
      const mk = e.target.closest('mark.mk');
      if (mk) {
        const card = document.getElementById('ann-' + mk.dataset.aid);
        if (card) { card.scrollIntoView({behavior:'smooth', block:'center'});
                    card.classList.add('flash'); setTimeout(()=>card.classList.remove('flash'), 1200); }
      }
    });
  </script>
</body>
</html>
