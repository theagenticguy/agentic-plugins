<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eval workbench</title>
  <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'&gt;&lt;rect width='16' height='16' rx='4' fill='%23e8edf1'/&gt;&lt;circle cx='8' cy='8' r='3' fill='%23274d7a'/&gt;&lt;/svg&gt;">

  <!-- All deps over CDN. No npm, no build step. Each is one <script> tag with
       a verified SRI hash. "Boring" means no toolchain — not no capability. -->
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
          integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.4"
          integrity="sha384-A986SAtodyH8eg8x8irJnYUk7i9inVQqYigD6qZ9evobksGNIXfeFvDwLSHcp31N"
          crossorigin="anonymous"></script>
  <!-- Chart.js: one self-contained UMD bundle (no d3). Tooltips, legends, and
       animations come for free in config — and a second chart type is ~6 lines. -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"
          integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@18.0.4/lib/marked.umd.min.js"
          integrity="sha384-QIom/Ao3tGhg4C4VY5VTDrHMTPzgsih5cGuY30rd/xp6hWQ+xIGIZ4kxhaQQY+PB"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.7/dist/purify.min.js"
          integrity="sha384-C5g1ZoYBpnvKyArNZI21kaBEk3egHOYfHj/cUOHmyJ7CSDMyNMyM+STqfkBt8m2Y"
          crossorigin="anonymous"></script>
  <!-- GFM code-block highlighting: highlight.js + the marked-highlight bridge. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css"
        integrity="sha384-eFTL69TLRZTkNfYZOLM+G04821K1qZao/4QLJbet1pP4tcF+fdXq/9CdqAbWRl/L"
        crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/highlight.min.js"
          integrity="sha384-RH2xi4eIQ/gjtbs9fUXM68sLSi99C7ZWBRX1vDrVv6GQXRibxXLbwO2NGZB74MbU"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked-highlight@2.2.4/lib/index.umd.js"
          integrity="sha384-BjBE0bY2PIGsLgdqaC1+iwO397c7jxwJdNszWabXYxrbMXBTS9QCPxXJElH8xOE/"
          crossorigin="anonymous"></script>
  <!-- Mermaid for diagrams in notes (```mermaid fences). globalThis.mermaid. -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.15.0/dist/mermaid.min.js"
          integrity="sha384-yQ4mmBBT+vhTAwjFH0toJXNYJ6O4usWnt6EPIdWwrRvx2V/n5lXuDZQwQFeSFydF"
          crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:        #e8edf1;
      --surface:   #fcfdfe;
      --surface-2: #dadfe5;
      --border:    #c7cfd7;
      --border-hi: #a9b4bf;
      --ink:       #0b0f14;
      --muted:     #3b4753;
      --faint:     #586471;
      --pass:      #0a6961;
      --fail:      #9a3b33;
      --review:    #7a5512;
      --signal:    #274d7a;
      --grid-line: rgba(120,134,150,0.20);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font: 14px/1.55 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 500px at 88% -10%, rgba(39,77,122,0.06) 0%, transparent 60%),
        radial-gradient(700px 400px at 0% 110%, rgba(10,105,97,0.07) 0%, transparent 55%),
        var(--bg);
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 32px 32px, 32px 32px;
      padding: 22px 26px 40px;
    }

    /* ---- header ---------------------------------------------------------- */
    header.top { display: flex; align-items: baseline; gap: 16px; margin-bottom: 22px; }
    h1 { font-family: "Tiempos Headline", "Iowan Old Style", "Charter", Georgia, "Times New Roman", serif; font-weight: 500;
         font-size: 27px; letter-spacing: -0.02em; margin: 0; line-height: 1; }
    h1 .dot { color: var(--signal); }
    .tag { font-family: "JetBrains Mono", monospace; font-size: 11px;
           color: var(--faint); text-transform: uppercase; letter-spacing: 0.12em; }
    .live { margin-left: auto; font-family: "JetBrains Mono", monospace; font-size: 11px;
            color: var(--muted); display: flex; align-items: center; gap: 7px;
            padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); }
    .live .led { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); transition: all .3s; }
    .live.on .led { background: var(--pass); box-shadow: 0 0 10px 1px var(--pass); animation: pulse 2s infinite; }
    .live.err .led { background: var(--fail); box-shadow: 0 0 10px 1px var(--fail); }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

    /* ---- resizable two-column layout ------------------------------------ */
    .grid { display: grid; grid-template-columns: minmax(0,1fr) 10px var(--right-w, 372px);
            gap: 0 8px; align-items: start; }
    .col-right { min-width: 0; }
    .splitter { align-self: stretch; cursor: col-resize; position: relative; min-height: 200px; }
    .splitter::before { content: ""; position: absolute; inset: 0 4px; border-radius: 3px;
                        background: var(--border); transition: background .15s; }
    .splitter:hover::before, .splitter.drag::before { background: var(--signal); }
    .splitter::after { content: "⋮"; position: absolute; top: 50%; left: 50%;
                       transform: translate(-50%,-50%); color: var(--faint); font-size: 12px; pointer-events: none; }
    @media (max-width: 920px) { .grid { grid-template-columns: 1fr; } .splitter { display: none; } }

    .panel { background: linear-gradient(180deg, var(--surface) 0%, #f4f7fa 100%);
             border: 1px solid var(--border); border-radius: 12px;
             box-shadow: 0 1px 2px rgba(11,15,20,0.06), 0 12px 28px -22px rgba(11,15,20,0.30);
             overflow: hidden; margin-bottom: 18px; }
    .col-left .panel { margin-bottom: 0; }
    .panel > header { margin: 0; padding: 11px 15px; border-bottom: 1px solid var(--border);
                      background: var(--surface-2); display: flex; align-items: center; gap: 9px; }
    .panel > header .lbl { font-family: "JetBrains Mono", monospace; font-size: 10.5px;
                           text-transform: uppercase; letter-spacing: 0.16em; color: var(--muted); }
    .panel > header .lbl::before { content: "▸ "; color: var(--signal); }
    .panel > header .hint { margin-left: auto; font-family: "JetBrains Mono", monospace;
                            font-size: 9px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.1em; }
    .panel .body { padding: 13px 15px; }

    /* ---- eval board / table --------------------------------------------- */
    .filters { display: flex; gap: 6px; padding: 11px 15px 0; }
    .chip { font-family: "JetBrains Mono", monospace; font-size: 11px; cursor: pointer;
            border: 1px solid var(--border); background: var(--surface-2); color: var(--muted);
            border-radius: 7px; padding: 4px 10px; transition: all .15s; }
    .chip:hover { border-color: var(--border-hi); color: var(--ink); }
    .chip.active { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; }

    .board-scroll { overflow-x: auto; }
    table.board { width: 100%; min-width: 440px; border-collapse: collapse; table-layout: fixed; }
    table.board col.c-case { width: 32%; } table.board col.c-exp,
    table.board col.c-act { width: 17%; } table.board col.c-st { width: 11%; }
    table.board col.c-rev { width: 23%; }
    table.board thead th { font-family: "JetBrains Mono", monospace; font-size: 9.5px; font-weight: 500;
                           text-transform: uppercase; letter-spacing: 0.14em; color: var(--faint);
                           text-align: left; padding: 12px 15px 8px; border-bottom: 1px solid var(--border); }
    table.board tbody td { padding: 11px 15px; border-bottom: 1px solid var(--grid-line);
                           vertical-align: top; min-width: 0; overflow-wrap: anywhere; }
    table.board tbody tr:last-child td { border-bottom: none; }
    table.board tbody tr { transition: background .15s; }
    table.board tbody tr:hover { background: rgba(39,77,122,0.05); }

    .case-name { font-weight: 600; font-size: 13.5px; }
    .case-in { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--muted);
               display: block; margin-top: 2px; overflow-wrap: anywhere; }
    .io { font-family: "JetBrains Mono", monospace; font-size: 11.5px; overflow-wrap: anywhere; }
    .io.empty { color: var(--faint); }

    .pill { font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 9px; border-radius: 999px;
            display: inline-flex; align-items: center; gap: 5px; border: 1px solid transparent;
            white-space: nowrap; }
    .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%;
                    background: currentColor; flex: 0 0 auto; }
    .pill.pass         { color: var(--pass);   background: rgba(10,105,97,0.12);  border-color: rgba(10,105,97,0.30); }
    .pill.fail         { color: var(--fail);   background: rgba(154,59,51,0.12);  border-color: rgba(154,59,51,0.30); }
    .pill.needs-review { color: var(--review); background: rgba(122,85,18,0.12);  border-color: rgba(122,85,18,0.30); }

    .actions { display: flex; gap: 5px; margin-bottom: 7px; flex-wrap: wrap; }
    .btn { font-family: "JetBrains Mono", monospace; font-size: 10.5px; cursor: pointer;
           border: 1px solid var(--border); background: var(--surface-2); color: var(--muted);
           border-radius: 6px; padding: 3px 8px; transition: all .12s; }
    .btn:hover { color: var(--ink); border-color: var(--border-hi); transform: translateY(-1px); }
    .btn[data-k="pass"]:hover   { color: var(--pass);   border-color: var(--pass); }
    .btn[data-k="fail"]:hover   { color: var(--fail);   border-color: var(--fail); }
    .btn[data-k="review"]:hover { color: var(--review); border-color: var(--review); }

    .note-in { width: 100%; font: 12px/1.4 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; background: var(--surface); color: var(--ink);
               border: 1px solid var(--border); border-radius: 7px; padding: 5px 8px; }
    .note-in:focus { outline: none; border-color: var(--signal); box-shadow: 0 0 0 3px rgba(39,77,122,0.12); }
    .note-in::placeholder { color: var(--faint); }

    /* ---- markdown ------------------------------------------------------- */
    .md { font-size: 12px; min-width: 0; overflow-wrap: anywhere; }
    .md p { margin: 3px 0; }
    .md code { font-family: "JetBrains Mono", monospace; font-size: 11px;
               background: rgba(11,15,20,0.05); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
    .md ul, .md ol { margin: 3px 0; padding-left: 18px; }
    .md a { color: var(--signal); }
    .md pre { background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px;
              padding: 9px 11px; margin: 6px 0; overflow-x: auto; }
    .md pre code { background: none; padding: 0; font-size: 11px; line-height: 1.5; }
    .md pre.mermaid { background: var(--surface-2); text-align: center; }
    .md pre.mermaid svg { max-width: 100%; height: auto; }
    .md table { border-collapse: collapse; margin: 6px 0; font-size: 11.5px; width: 100%; }
    .md th, .md td { border: 1px solid var(--border); padding: 3px 8px; text-align: left; }
    .md th { background: var(--surface-2); font-family: "JetBrains Mono", monospace;
             font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .md del { color: var(--faint); }
    .md input[type=checkbox] { accent-color: var(--signal); }

    /* embed chips: tables + diagrams collapse to a compact opener by default */
    .embed-chip { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; max-width: 100%;
                  font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--muted);
                  background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px;
                  padding: 5px 9px; margin: 6px 0; transition: all .14s; text-align: left; }
    .embed-chip:hover { border-color: var(--signal); color: var(--ink);
                        transform: translateY(-1px); box-shadow: 0 6px 18px -10px var(--signal); }
    .embed-chip .ec-ic { color: var(--signal); font-size: 13px; line-height: 1; }
    .embed-chip .ec-dim { color: var(--faint); }
    .embed-chip .ec-go { margin-left: auto; color: var(--faint); font-size: 9px;
                         text-transform: uppercase; letter-spacing: 0.1em; }
    .embed-diagram { flex-direction: column; align-items: stretch; gap: 0; padding: 0; overflow: hidden; width: 100%; }
    .embed-diagram .ec-thumb { background: var(--surface-2); padding: 8px; max-height: 104px;
                               overflow: hidden; display: flex; justify-content: center; align-items: center; }
    .embed-diagram .ec-thumb svg { max-width: 100%; max-height: 88px; height: auto; opacity: .92; }
    .embed-diagram .ec-bar { display: flex; align-items: center; gap: 7px;
                             padding: 6px 10px; border-top: 1px solid var(--border); }

    .cnote, .hnote { margin-top: 5px; padding: 5px 9px; border-radius: 7px; border-left: 2px solid; min-width: 0; }
    .cnote { background: rgba(39,77,122,0.12); border-color: var(--signal); }
    .hnote { background: rgba(10,105,97,0.12); border-color: var(--pass); }
    .cnote .who, .hnote .who { font-family: "JetBrains Mono", monospace; font-size: 9px;
                               text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 1px;
                               display: flex; align-items: center; gap: 6px; }
    .cnote .who { color: var(--signal); } .hnote .who { color: var(--pass); }
    .who .expand { margin-left: auto; cursor: pointer; color: var(--faint); border: none;
                   background: none; font: inherit; font-size: 9px; }
    .who .expand:hover { color: var(--signal); }

    /* ---- summary stats + charts ----------------------------------------- */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .stat { background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px;
            padding: 9px 10px; text-align: center; }
    .stat .n { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 22px; line-height: 1; }
    .stat .k { font-family: "JetBrains Mono", monospace; font-size: 9px; text-transform: uppercase;
               letter-spacing: 0.1em; color: var(--faint); margin-top: 5px; }
    .stat.pass .n { color: var(--pass); } .stat.fail .n { color: var(--fail); }
    .stat.review .n { color: var(--review); } .stat.total .n { color: var(--ink); }
    .charts { display: grid; grid-template-columns: minmax(0,1fr) 122px; gap: 12px; margin-top: 14px; align-items: center; }
    .chart-cell { min-width: 0; }
    .chart-cap { font-family: "JetBrains Mono", monospace; font-size: 9.5px; color: var(--faint);
                 text-transform: uppercase; letter-spacing: 0.12em; margin: 0 0 6px; }
    #chart-history { max-height: 150px; } #chart-split { max-height: 118px; }

    /* ---- event log (resizable, click to disclose in a sheet) ------------ */
    .resize-y { resize: vertical; overflow: auto; max-height: 360px; min-height: 120px; padding: 4px 15px 13px; }
    .ev { display: grid; grid-template-columns: 52px minmax(0,1fr); gap: 9px; padding: 8px 0;
          border-bottom: 1px solid var(--grid-line); cursor: pointer; transition: background .12s;
          border-radius: 6px; }
    .ev:last-child { border-bottom: none; }
    .ev:hover { background: rgba(11,15,20,0.04); }
    .ev .src { font-family: "JetBrains Mono", monospace; font-size: 9px; font-weight: 700;
               text-transform: uppercase; letter-spacing: 0.08em; padding-top: 2px; }
    .ev .src.human  { color: var(--pass); }
    .ev .src.claude { color: var(--signal); }
    .ev .src.system { color: var(--faint); }
    .ev .t { font-family: "JetBrains Mono", monospace; font-size: 9.5px; color: var(--faint); margin-bottom: 2px; }
    .ev .md { min-width: 0; max-height: 168px; overflow: hidden;
              -webkit-mask-image: linear-gradient(#000 78%, transparent); mask-image: linear-gradient(#000 78%, transparent); }

    /* ---- overlays: modal (centered artifact) + sheet (right disclosure) -- */
    .ov { position: fixed; inset: 0; display: none; }
    .ov.open { display: block; }
    .ov-scrim { position: absolute; inset: 0; background: rgba(11,15,20,0.28); backdrop-filter: blur(5px); }
    .ov-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 10px;
               padding: 11px 15px; background: var(--surface-2); border-bottom: 1px solid var(--border); }
    .ov-title { font-family: "JetBrains Mono", monospace; font-size: 10.5px; text-transform: uppercase;
                letter-spacing: 0.14em; color: var(--muted); }
    .ov-title::before { content: "▸ "; color: var(--signal); }
    .ov-close { margin-left: auto; font-family: "JetBrains Mono", monospace; font-size: 9.5px; cursor: pointer;
                background: transparent; color: var(--muted); border: 1px solid var(--border);
                border-radius: 6px; padding: 3px 9px; transition: all .12s; }
    .ov-close:hover { color: var(--signal); border-color: var(--signal); }
    .ov-body { padding: 16px 18px; }

    #modal { z-index: 70; }
    #modal .ov-card { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(.96);
                      background: var(--surface); border: 1px solid var(--border-hi); border-radius: 16px;
                      max-width: 92vw; max-height: 90vh; overflow: auto; box-shadow: 0 40px 100px -24px rgba(11,15,20,0.30);
                      opacity: 0; transition: opacity .18s, transform .18s; }
    #modal.open .ov-card { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    #modal .ov-body { display: grid; place-items: center; }
    #modal .ov-body svg { width: auto; max-width: 86vw; height: auto; max-height: 78vh; }

    #sheet { z-index: 62; }
    #sheet .ov-card { position: absolute; top: 0; right: 0; height: 100%; width: min(480px, 94vw);
                      background: var(--surface); border-left: 1px solid var(--border-hi);
                      box-shadow: -30px 0 80px -30px rgba(11,15,20,0.28); overflow: auto;
                      transform: translateX(100%); transition: transform .26s cubic-bezier(.4,0,.2,1); }
    #sheet.open .ov-card { transform: translateX(0); }
    #sheet .ov-body .md { font-size: 13px; }
  </style>
</head>

<!--
  ONE EventSource for the whole page (htmx SSE extension on <body>). The server
  emits NAMED events; each region re-fetches its partial via hx-trigger="sse:<name>".
  SSE is the invalidation signal; the HTML arrives over a normal GET.
-->
<body hx-ext="sse" sse-connect="/events">
  <header class="top">
    <h1>eval workbench<span class="dot">.</span></h1>
    <span class="tag">disposable · 127.0.0.1 · this session only</span>
    <span class="live" id="live"><span class="led"></span><span id="live-txt">connecting…</span></span>
  </header>

  <div class="grid" id="grid">
    <div class="col-left">
      <section class="panel">
        <header><span class="lbl">eval board</span></header>
        <div id="eval-board" hx-get="/partials/eval-board" hx-trigger="load, sse:eval-board"></div>
      </section>
    </div>

    <div class="splitter" id="splitter" title="drag to resize"></div>

    <div class="col-right">
      <section class="panel">
        <header><span class="lbl">run summary</span></header>
        <div class="body">
          <div id="run-summary" hx-get="/partials/run-summary" hx-trigger="load, sse:run-summary"></div>
          <div class="charts">
            <div class="chart-cell">
              <p class="chart-cap">history · stacked</p>
              <canvas id="chart-history"></canvas>
            </div>
            <div class="chart-cell">
              <p class="chart-cap">current · split</p>
              <canvas id="chart-split"></canvas>
            </div>
          </div>
        </div>
      </section>

      <section class="panel">
        <header><span class="lbl">recent events</span><span class="hint">click to expand · drag ⤓</span></header>
        <div class="resize-y">
          <div id="event-log" hx-get="/partials/event-log" hx-trigger="load, sse:event-log"></div>
        </div>
      </section>
    </div>
  </div>

  <!-- centered modal: one visual artifact (diagram or table) -->
  <div class="ov" id="modal">
    <div class="ov-scrim" data-close></div>
    <div class="ov-card">
      <div class="ov-head"><span class="ov-title">view</span><button class="ov-close" data-close>✕ esc</button></div>
      <div class="ov-body"></div>
    </div>
  </div>

  <!-- right sheet: full text disclosure (an event or a note, rendered wide) -->
  <div class="ov" id="sheet">
    <div class="ov-scrim" data-close></div>
    <div class="ov-card">
      <div class="ov-head"><span class="ov-title">detail</span><button class="ov-close" data-close>✕ esc</button></div>
      <div class="ov-body"></div>
    </div>
  </div>

  <script>
    // ---- markdown engine: marked (GFM) + highlight.js + mermaid + DOMPurify
    mermaid.initialize({
      startOnLoad: false, theme: 'base', securityLevel: 'strict',
      themeVariables: { fontFamily: 'JetBrains Mono, monospace', fontSize: '12px',
                        primaryColor: '#dadfe5', primaryBorderColor: '#274d7a',
                        lineColor: '#586471', primaryTextColor: '#0b0f14' },
    });
    marked.use(markedHighlight.markedHighlight({
      langPrefix: 'hljs language-',
      highlight(code, lang) {
        if (lang === 'mermaid') return code;
        const l = hljs.getLanguage(lang) ? lang : 'plaintext';
        return hljs.highlight(code, { language: l }).value;
      },
    }));
    marked.use({ renderer: {
      code(token) {
        if (token.lang === 'mermaid') {
          return `<pre class="mermaid">${token.text
            .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</pre>`;
        }
        return false;
      },
    }});

    let mmid = 0;
    const mdSrc = new Map();   // .md element -> raw markdown source (for re-render in a sheet)
    const embeds = new Map();  // chip id -> full artifact node (for the modal)
    let embedSeq = 0;

    // Core renderer. embed=true -> tables & diagrams collapse to chips (narrow
    // columns stay tidy). embed=false -> render everything inline (wide sheet).
    async function renderInto(node, src, embed) {
      node.innerHTML = DOMPurify.sanitize(marked.parse((src || '').trim()),
        { ADD_TAGS: ['pre'], ADD_ATTR: ['class'] });
      const diagrams = node.querySelectorAll('pre.mermaid:not([data-mm])');
      diagrams.forEach(d => { d.id = 'mm-' + (mmid++); d.dataset.mm = '1'; });
      if (diagrams.length) await mermaid.run({ nodes: diagrams }).catch(() => {});
      if (!embed) return;
      // tables -> chip
      node.querySelectorAll('table').forEach(t => {
        const rows = Math.max(0, t.rows.length - 1), cols = t.rows[0]?.cells.length || 0;
        t.replaceWith(tableChip(t.cloneNode(true), rows, cols));
      });
      // diagrams -> thumbnail chip
      node.querySelectorAll('pre.mermaid').forEach(d => d.replaceWith(diagramChip(d)));
    }

    function tableChip(full, rows, cols) {
      const id = 'e' + (embedSeq++); embeds.set(id, full);
      const b = document.createElement('button');
      b.className = 'embed-chip'; b.dataset.embed = id; b.dataset.title = `table · ${rows}×${cols}`;
      b.innerHTML = `<span class="ec-ic">▦</span><span>table</span>` +
                    `<span class="ec-dim">${rows}×${cols}</span><span class="ec-go">open ⤢</span>`;
      return b;
    }
    function diagramChip(pre) {
      const id = 'e' + (embedSeq++); embeds.set(id, pre.cloneNode(true));
      const b = document.createElement('button');
      b.className = 'embed-chip embed-diagram'; b.dataset.embed = id; b.dataset.title = 'diagram';
      const thumb = document.createElement('div'); thumb.className = 'ec-thumb';
      const svg = pre.querySelector('svg');
      if (svg) { const cl = svg.cloneNode(true); cl.removeAttribute('width'); cl.removeAttribute('height'); thumb.appendChild(cl); }
      const bar = document.createElement('div'); bar.className = 'ec-bar';
      bar.innerHTML = `<span class="ec-ic">◫</span><span>diagram</span><span class="ec-go">expand ⤢</span>`;
      b.append(thumb, bar);
      return b;
    }

    // Walk freshly-swapped HTML and render any unprocessed .md blocks.
    async function renderMarkdown(root) {
      const els = (root || document).querySelectorAll('.md:not([data-md])');
      for (const el of els) {
        const src = el.textContent;
        mdSrc.set(el, src);
        el.dataset.md = '1';
        await renderInto(el, src, true);
      }
    }

    // ---- overlays
    function openModal(title, node) {
      const m = document.getElementById('modal');
      m.querySelector('.ov-title').textContent = title;
      const body = m.querySelector('.ov-body'); body.replaceChildren(node);
      const svg = body.querySelector('svg');
      if (svg) { svg.style.maxWidth = 'none'; svg.style.width = 'min(86vw, 1100px)';
                 svg.style.height = 'auto'; svg.setAttribute('preserveAspectRatio', 'xMidYMid meet'); }
      m.classList.add('open');
    }
    async function openSheet(title, src) {
      const s = document.getElementById('sheet');
      s.querySelector('.ov-title').textContent = title;
      const body = s.querySelector('.ov-body');
      const holder = document.createElement('div'); holder.className = 'md';
      body.replaceChildren(holder);
      await renderInto(holder, src, false);   // full width, no chips
      s.classList.add('open');
    }
    function closeOverlays() {
      document.getElementById('modal').classList.remove('open');
      document.getElementById('sheet').classList.remove('open');
    }

    document.addEventListener('click', (e) => {
      const chip = e.target.closest('.embed-chip');
      if (chip) { const n = embeds.get(chip.dataset.embed);
                  if (n) openModal(chip.dataset.title, n.cloneNode(true)); return; }
      const exp = e.target.closest('.expand');
      if (exp) { const md = exp.closest('.cnote, .hnote')?.querySelector('.md');
                 if (md) openSheet(exp.dataset.title || 'note', mdSrc.get(md) ?? md.textContent); return; }
      const row = e.target.closest('.ev');
      if (row) { const md = row.querySelector('.md');
                 const who = row.querySelector('.src')?.textContent.trim() || 'event';
                 const t = row.querySelector('.t')?.textContent.trim() || '';
                 if (md) openSheet(`${who} · ${t}`, mdSrc.get(md) ?? md.textContent); return; }
      if (e.target.closest('[data-close]')) closeOverlays();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlays(); });

    // ---- Chart.js: stacked-area history + doughnut split (tooltips built-in)
    Chart.defaults.color = '#586471';
    Chart.defaults.font.family = 'JetBrains Mono, monospace';
    Chart.defaults.font.size = 10;
    const C = { pass: '#0a6961', fail: '#9a3b33', review: '#7a5512' };
    const fill = a => ({ pass: `rgba(10,105,97,${a})`, fail: `rgba(154,59,51,${a})`, review: `rgba(122,85,18,${a})` });
    let historyChart, splitChart;

    async function renderChart() {
      const { runs } = await (await fetch('/data/run-history')).json();
      const labels = runs.map(r => r.label);
      const series = k => runs.map(r => r['n_' + k]);
      const ds = (k) => ({ label: k, data: series(k), borderColor: C[k], backgroundColor: fill(0.18)[k],
        fill: true, tension: 0.35, borderWidth: 2, pointRadius: 2, pointHoverRadius: 5, stack: 's' });

      if (!historyChart) {
        historyChart = new Chart(document.getElementById('chart-history'), {
          type: 'line', data: { labels, datasets: [ds('pass'), ds('fail'), ds('review')] },
          options: { responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            scales: { x: { grid: { color: 'rgba(120,134,150,0.20)' }, ticks: { maxRotation: 0, autoSkipPadding: 12 } },
                      y: { stacked: true, beginAtZero: true, grid: { color: 'rgba(120,134,150,0.20)' }, ticks: { precision: 0 } } },
            plugins: { legend: { display: false },
              tooltip: { backgroundColor: '#fcfdfe', titleColor: '#0b0f14', bodyColor: '#1c232b', footerColor: '#3b4753',
                         borderColor: '#c7cfd7', borderWidth: 1, cornerRadius: 8,
                         padding: 9, usePointStyle: true,
                         callbacks: { footer: items => 'total ' + items.reduce((s, i) => s + i.parsed.y, 0) } } } },
        });
      } else { historyChart.data.labels = labels;
               historyChart.data.datasets.forEach(d => { d.data = series(d.label); }); historyChart.update(); }

      const num = sel => +(document.querySelector(sel)?.textContent || 0);
      const split = [num('.stat.pass .n'), num('.stat.fail .n'), num('.stat.review .n')];
      if (!splitChart) {
        splitChart = new Chart(document.getElementById('chart-split'), {
          type: 'doughnut',
          data: { labels: ['pass', 'fail', 'review'],
                  datasets: [{ data: split, backgroundColor: [C.pass, C.fail, C.review],
                               borderColor: '#fcfdfe', borderWidth: 2, hoverOffset: 6 }] },
          options: { responsive: true, maintainAspectRatio: false, cutout: '62%',
            plugins: { legend: { display: false },
              tooltip: { backgroundColor: '#fcfdfe', titleColor: '#0b0f14', bodyColor: '#1c232b',
                         borderColor: '#c7cfd7', borderWidth: 1, cornerRadius: 8,
                         padding: 8, callbacks: { label: c => `${c.label}: ${c.parsed}` } } } },
        });
      } else { splitChart.data.datasets[0].data = split; splitChart.update(); }
    }

    // ---- draggable column splitter (width persists in localStorage)
    (function () {
      const grid = document.getElementById('grid'), splitter = document.getElementById('splitter');
      let w = +localStorage.getItem('rightW') || 372;
      const apply = px => grid.style.setProperty('--right-w', px + 'px');
      apply(w);
      let dragging = false;
      splitter.addEventListener('pointerdown', e => {
        dragging = true; splitter.classList.add('drag'); splitter.setPointerCapture(e.pointerId);
        document.body.style.userSelect = 'none';
      });
      splitter.addEventListener('pointermove', e => {
        if (!dragging) return;
        w = Math.max(300, Math.min(680, grid.getBoundingClientRect().right - e.clientX));
        apply(w);
      });
      splitter.addEventListener('pointerup', () => {
        if (!dragging) return;
        dragging = false; splitter.classList.remove('drag'); document.body.style.userSelect = '';
        localStorage.setItem('rightW', Math.round(w));
        historyChart?.resize(); splitChart?.resize();
      });
    })();

    // ---- live indicator + post-swap rendering
    const live = document.getElementById('live'), liveTxt = document.getElementById('live-txt');
    document.body.addEventListener('htmx:sseOpen',  () => { live.className = 'live on';  liveTxt.textContent = 'live'; });
    document.body.addEventListener('htmx:sseError', () => { live.className = 'live err'; liveTxt.textContent = 'reconnecting…'; });
    document.body.addEventListener('htmx:afterSwap', (e) => {
      renderMarkdown(e.target);
      if (e.target.id === 'run-summary') renderChart();
    });

    renderChart();
  </script>
</body>
</html>
