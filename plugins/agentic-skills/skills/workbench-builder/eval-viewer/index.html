<!doctype html>
<!-- Fullstack entry: Bun.serve imports this file and transpiles src/main.tsx
     (and everything it imports, including CSS) on demand. No bundler config. -->
<!-- `astryx theme build` wraps every rule it emits in
     `@scope ([data-astryx-theme="graphite"]) to ([data-astryx-theme])`, so the
     Graphite tokens only resolve on elements carrying that attribute. The <Theme>
     provider in src/main.tsx writes both attributes onto <html> too, but it does
     so in a layout effect — declaring them here means the first painted frame is
     already Graphite instead of flashing core's light-dark() defaults.
     data-theme drives color-scheme, hence browser chrome (scrollbars, native
     controls); it must match the provider's `mode`. -->
<html lang="en" data-astryx-theme="graphite" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eval Viewer</title>
    <!-- Pins @layer precedence ahead of the bundler's stylesheet links. Bun
         emits the CSS imports from src/main.tsx in reverse order, and
         src/theme/graphite.css opens with its own `@layer reset` block, so
         first-appearance ordering resolves to `reset, astryx-theme, astryx-base`:
         astryx-base wins and core's :root token defaults beat Graphite's :scope
         tokens even with the attribute set. This statement fixes the order
         however the links land. Layer names verified against the built CSS —
         `astryx theme build` emits exactly `reset` and `astryx-theme`. -->
    <style>
      @layer reset, astryx-base, astryx-theme;

      /* The theme styles h1–h6, p, small, code and the .astryx-* classes, never
         body — so the page canvas needs its own rule or it paints as the
         browser's white with Times New Roman inherited into anything the
         component library doesn't wrap. These rules are deliberately unlayered:
         unlayered declarations outrank every @layer above, so they land whatever
         order Bun emits the stylesheet links in.
         The Graphite tokens resolve here because <html> carries
         data-astryx-theme="graphite" — body is inside that @scope root and does
         not match the `to ([data-astryx-theme])` limit. `color-scheme: light`
         from html[data-theme="light"] inherits down, so light-dark() picks the
         light pair. */
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--color-background-body);
        font-family: var(--font-family-body);
        color: var(--color-text-primary);
      }

      /* Astryx Button and Collapsible draw their own ring, but @astryxdesign/core
         0.3.0 resolves TextArea's focus style to a zero-size transparent inset
         shadow, so keyboard focus on a note field is invisible. One unlayered
         rule gives every focusable the same indicator (WCAG 2.4.7). */
      :focus-visible {
        outline: 2px solid var(--color-accent);
        outline-offset: 2px;
      }
    </style>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%230a6961'/></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
